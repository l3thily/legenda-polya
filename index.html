  if(a>=38||(a>=34&&(RP()<.35||n.ovr<72))){n.done=true;n.endY=S.label;S.news.push(`${n.name}, ваш заклятый соперник, завершил карьеру. Итог спора за Золотой мяч — ${n.w}:${n.l}${n.w>n.l?' в вашу пользу':n.w<n.l?' в его пользу':''}.`)}
}
function nemAvoid(){
  const P=G.P,n=P.nem;if(!n||n.done||n.club!==P.clubId)return;
  const c=C(P.clubId),pool=G.clubs.filter(x=>x.id!==c.id&&Math.abs(x.str-c.str)<=5&&allowedClub(x.id));if(!pool.length)return;
  const t=pickP(pool);n.club=t.id;n.tr.push({y:G.year,to:t.name,fee:0});G.summer.push(`${n.name} отказался делить с вами раздевалку и ушёл в «${t.name}».`);
}
function nemDecision(){
  const P=G.P,n=P.nem;if(!n||n.done||(n.evY&&G.year-n.evY<3)||RP()>.3)return null;n.evY=G.year;
  const last=G.seasons[0];
  if(last&&last.nem&&last.nem.place<last.nem.me)return ev('Соперник празднует',`${n.name} выложил фото с трофеями и подписью «Кто-то опять смотрит снизу». Все поняли, о ком речь.`,[
    ['Ответить мемом','Соцсети взорвутся','Подписчики +12%, тренер не в восторге',{fol:.12,coach:-4,fans:3,log:`Ваш ответ ${n.name} собрал миллионы просмотров.`}],
    ['Промолчать','Ответить на поле','Прогресс чуть быстрее',{growMod:.4,log:'Вы промолчали и стали больше работать.'}],
    ['Поздравить','По-мужски','Репутация растёт',{rep:2,log:`Вы поздравили ${n.name}. Пресса оценила.`}]]);
  return ev('Пресса сталкивает лбами',`На каждой пресс-конференции вас спрашивают про ${n.name}: «Кто из вас сильнее?»`,[
    ['«Я лучше»','Без ложной скромности','Хайп растёт, но провал вам припомнят',{fol:.08,rep:1,coach:-2,log:'Ваше «я лучше» стало мемом.'}],
    ['«Он отличный игрок»','Уважение','Раздевалка ценит',{team:4,rep:1,log:`Вы отозвались о ${n.name} с уважением.`}],
    ['Без комментариев','Только футбол','Чуть быстрее прогресс',{growMod:.2,log:'Вы отказались обсуждать соперника.'}]]);
}

function posAt(y){const P=G.P;let p=P.pos0||P.pos;(P.posHist||[]).forEach(h=>{if(h.y<=y)p=h.pos});return p}
/* the position you played most seasons at: career summaries compare by it */
function mainPos(){const P=G.P,n={};G.seasons.forEach(s=>{const p=s.pos||posAt(s.year);n[p]=(n[p]||0)+1});const k=Object.keys(n).sort((a,b)=>n[b]-n[a])[0];return k||P.pos}
const sumPos=()=>G.phase==='retired'&&G.seasons.length?mainPos():G.P.pos;
const OUT_BY={ATT:x=>x.g/100+x.a/250,MID:x=>x.a/120+x.g/200,DEF:x=>x.cs/60+x.apps/500+x.g/80,GK:x=>x.cs/50+x.apps/400};
function nemVerdict(){const P=G.P,n=P.nem;if(!n)return 0;const f=OUT_BY[POS[sumPos()].grp];const my=P.awards.filter(x=>x.n==='Золотой мяч').length*10+P.trophies.length+f({g:P.tot.g+P.ig,a:P.tot.a,cs:P.tot.cs,apps:P.tot.apps+P.caps}),his=n.bdo*10+n.tro+f(n.tot);return my>his?1:my<his?-1:0}
/* ---- the morning paper after a season ---- */
const PAPERS=['Спортивный курьер','Голос трибун','Футбольный вестник','Вечерний гол','Утренний свисток'];
function frontPage(s){
  const P=G.P,sur=P.name.trim().split(/\s+/).pop().toUpperCase(),club=s.clubName.toUpperCase(),c=s.club,avg=c.apps?c.rs/c.apps:0,h=hashStr(s.label+s.clubName),v=a=>a[h%a.length];
  const W=n=>s.trophies.includes(n),majors=['Лига чемпионов','Чемпионат мира','Чемпионат Европы','Копа Америка'];
  let head,sub,tone='';
  if(s.awards.includes('Золотой мяч')){head=v([`${sur} — ЛУЧШИЙ НА ПЛАНЕТЕ`,`ЗОЛОТОЙ ${sur}`,`ПАРИЖ АПЛОДИРУЕТ: ${sur}`]);tone='gold'}
  else if(W('Чемпионат мира')){head=v(['ЧЕМПИОНЫ МИРА!','МИР У НАШИХ НОГ','ЗВЁЗДЫ НА ФУТБОЛКЕ']);tone='gold'}
  else if(W('Лига чемпионов')){head=v([`${sur} ПОДНИМАЕТ «УШАСТЫЙ»`,`${club} — КОРОЛЬ ЕВРОПЫ`,'ЕВРОПА ПОКОРЕНА']);tone='gold'}
  else if(majors.some(W)){head=v([`${sur} ВЕДЁТ СБОРНУЮ К ТИТУЛУ`,'КОНТИНЕНТ НАШ!']);tone='gold'}
  else if(s.lgPos===1){head=v([`${club} — ЧЕМПИОН!`,`ТИТУЛ В КАРМАНЕ У ${club}`,`${sur} И ${club}: ЧЕМПИОНСКИЙ СЕЗОН`]);tone='gold'}
  else if((s.news||[]).some(x=>/вылетел из лиги|relegated from/.test(x))){head=v([`ПОЗОР: ${club} ВЫЛЕТАЕТ`,`${club} ПАДАЕТ НА ДНО`]);tone='bad'}
  else if((s.records||[]).some(x=>/^(Рекорд|Record)/.test(x))){head=v([`РЕКОРД! ${sur} ПЕРЕПИСЫВАЕТ ИСТОРИЮ`,`${sur} ЛОМАЕТ ВЕКОВОЙ РЕКОРД`])}
  else if(c.g>=30){head=v([`${c.g} ГОЛОВ! ${sur} НЕ ОСТАНОВИТЬ`,`${sur}: ${c.g} МЯЧЕЙ ЗА СЕЗОН`])}
  else if(s.inj&&s.inj.some(n=>n>=12)){head=v([`СЕЗОН НА КОСТЫЛЯХ: ${sur}`,`ТРАВМА СЛОМАЛА СЕЗОН ${sur}`]);tone='bad'}
  else if(s.nem&&s.nem.place<s.nem.me&&s.nem.place<=10){head=v([`${s.nem.n.split(' ').pop().toUpperCase()} СНОВА ВПЕРЕДИ`,`${sur} В ТЕНИ СОПЕРНИКА`]);tone='bad'}
  else if(s.ovrAfter-s.ovrBefore>=4&&s.age<=22){head=v([`${s.age+1}-ЛЕТНИЙ ${sur}: РОЖДЕНИЕ ЗВЕЗДЫ`,`ВУНДЕРКИНД ${sur} РАСТЁТ НА ГЛАЗАХ`])}
  else if(c.apps<12){head=v([`ГДЕ ${sur}?`,`${sur} ПРОПАЛ ИЗ СОСТАВА`]);tone='bad'}
  else if(avg>=7.3){head=v([`${sur} ТАЩИТ ${club}`,`СЕЗОН ИМЕНИ ${sur}`])}
  else head=v([`РАБОЧИЙ СЕЗОН ${sur}`,`${sur}: БЕЗ ЧУДЕС, НО СТАБИЛЬНО`,`${club} ЗАВЕРШАЕТ СЕЗОН`]);
  sub=[`${s.clubName}: ${s.lgPos}-е место`,P.pos==='GK'?`${c.cs} сухих`:`${c.g} ${plural(c.g,'гол','гола','голов')}, ${c.a} ${plural(c.a,'передача','передачи','передач')}`,avg?`средняя оценка ${avg.toFixed(2).replace('.',',')}`:'',s.bdo&&s.bdo.place<=30?`Золотой мяч: ${s.bdo.place}-е место`:''].filter(Boolean).join(' · ');
  return {paper:PAPERS[h%PAPERS.length],no:1000+(h%9000),head,sub,tone,date:`${s.year+1}, июнь`};
}
function paperHtml(s,big){const f=frontPage(s);return `<div class="paper ${f.tone} ${big?'big':''}"><div class="pp-top"><b>${esc(f.paper)}</b><span>№${f.no} · ${f.date}</span></div><h3>${esc(f.head)}</h3><p>${esc(f.sub)}</p></div>`}

/* ---- career filmstrip ---- */
function bestMoment(s){
  const big=['Лига чемпионов','Чемпионат мира','Чемпионат Европы','Копа Америка'];
  if(s.awards.includes('Золотой мяч'))return ['gold','Золотой мяч'];
  const t=s.trophies.find(x=>big.includes(x));if(t)return ['gold',t];
  if(s.trophies.length)return ['gold',s.trophies[0]];
  const r=(s.records||[]).find(x=>/^(Рекорд|Record)/.test(x));if(r)return ['rec',r.replace(/^(Рекорд|Record): /,'')];
  if(s.awards.length)return ['aw',s.awards[0]];
  const tr=(s.summer||[]).find(x=>/^(Переход|Transfer)/.test(x));if(tr)return ['move',tr.split(':')[0]];
  const c=s.club;return ['', G.P.pos==='GK'?`${c.cs} сухих матчей`:`${c.g} ${plural(c.g,'гол','гола','голов')} за сезон`];
}
function filmstrip(){
  if(!G.seasons.length)return '';
  return `<div class="film" role="list">${G.seasons.slice().reverse().map(s=>{const [k,t]=bestMoment(s);return `<div class="frame ${k}" role="listitem"><span class="f-y">${s.label}</span><b>${esc(s.clubName)}</b><span class="f-m">${esc(t)}</span>${s.km?`<span class="f-sk" title="${esc(s.km.c+' · '+s.km.t)}">${sketchSvg(s.km.d,true)}</span>`:''}<span class="f-o num">${s.ovrAfter}<small>${s.age} л.</small></span></div>`}).join('')}</div>`;
}

/* ================= goal sketches: a tactics-board drawing of a goal or a key moment =================
   d = 'type:seed' (types below). The layout comes from the seed only, never from the match RNG.
   Animated version draws the passes and the shot in order (CSS dash + SMIL ball); static=true gives the last frame. */
const SK_T=['shot','round','fk','fkl','fkp','fkpass','head','headpass','pen','ast','gen','me','op','save','tackle','miss'];
function sketchSvg(d,static_){
  const [t0,sd]=String(d||"gen:1").split(":"),r=mulb(+sd||1),u=(a,b)=>a+(b-a)*r(),f=n=>Math.round(n*10)/10;
  let t=SK_T.includes(t0)?t0:'gen';
  if(t==='me')t=['shot','head','shot','pen'][Math.floor(r()*4)];
  const flip=t==='op'||t==='save'||t==='tackle';
  const P={me:[],mate:[],opp:[]},seq=[];let ball=null;
  const add=(k,x,y)=>{P[k].push([x,y]);return [x,y]};
  const leg=(a,b,kind,bend)=>{const mx=(a[0]+b[0])/2+(bend||0),my=(a[1]+b[1])/2-(bend?Math.abs(bend)*.4:0);seq.push({d:`M${f(a[0])} ${f(a[1])}Q${f(mx)} ${f(my)} ${f(b[0])} ${f(b[1])}`,kind,end:b,mine:P.me.some(p=>p[0]===a[0]&&p[1]===a[1])})};
  const goalPt=side=>[60+side*u(5,9.5),4.2];
  const gk=add('opp',60+u(-3,3),9);
  if(t==='shot'||t==='gen'){const s=add(t==='gen'?'mate':'me',u(42,78),u(24,36)),p=add('mate',u(18,102),u(44,57));add('opp',f(s[0]+u(-8,8)),s[1]+u(4,8));add('opp',u(30,90),u(16,24));leg(p,s,'pass',u(-10,10));leg(s,goalPt(s[0]<60?1:-1),'shot',u(-3,3))}
  else if(t==='round'){const s=add('me',u(46,74),u(30,40)),k=[gk[0]+(s[0]<60?7:-7),12];add('opp',u(30,50),u(30,44));leg(s,k,'run',s[0]<60?6:-6);leg(k,[60,4.2],'shot',0)}
  else if(t==='fk'||t==='fkl'||t==='fkp'||t==='fkpass'){const s=add('me',u(38,82),u(38,44)),gx=s[0]<60?1:-1;for(let i=0;i<4;i++)add('opp',f(s[0]+(60-s[0])*.32+(i-1.5)*3.2),s[1]-10);add('opp',u(40,80),u(18,26));
    if(t==='fkpass'){const m=add('mate',s[0]+gx*u(10,16),s[1]-u(4,8));leg(s,m,'pass',0);leg(m,goalPt(gx),'shot',gx*-4)}else leg(s,goalPt(gx),'shot',t==='fk'?-gx*u(10,14):t==='fkl'?0:gx*-2)}
  else if(t==='head'||t==='headpass'){const c=[u(0,1)<.5?2:118,2],s=add('me',u(52,68),u(12,18));add('opp',s[0]+u(-4,4),s[1]+u(2,4));add('opp',u(40,80),u(10,20));
    if(t==='headpass'){const m=add('mate',s[0]+u(-10,10),u(10,16));leg(c,s,'pass',c[0]<60?10:-10);leg(s,m,'pass',0);leg(m,goalPt(m[0]<60?1:-1),'shot',0)}else{leg(c,s,'pass',c[0]<60?10:-10);leg(s,goalPt(s[0]<60?1:-1),'shot',0)}}
  else if(t==='pen'){const s=add('me',60,26);leg(s,goalPt(u(0,1)<.5?1:-1),'shot',0)}
  else if(t==='ast'){const s=add('me',r()<.5?u(92,104):u(16,28),u(22,34)),m=add('mate',u(52,68),u(10,18));add('opp',m[0]+u(-5,5),m[1]+u(2,5));add('opp',u(40,80),u(22,30));const p=add('mate',u(40,80),u(46,57));leg(p,s,'pass',u(-12,12));leg(s,m,'pass',s[0]<60?-8:8);leg(m,goalPt(m[0]<60?1:-1),'shot',0)}
  else if(t==='miss'){const s=add('me',u(42,78),u(22,34));leg(s,[60+(s[0]<60?1:-1)*u(13,17),2],'shot',u(-4,4))}
  else if(flip){/* their attack on our goal: drawn on the same board, our goal at the top */
    P.opp.pop();const keeper=t==='save'?add('me',60,9):add('mate',60,9),a=add('opp',u(36,84),u(22,34)),p=add('opp',u(20,100),u(44,57));
    if(t==='tackle'){const me=add('me',a[0]+u(-3,3),a[1]-u(6,9));add('mate',u(30,90),u(30,44));leg(p,a,'pass',u(-8,8));leg(a,me,'run',0);seq.push({x:me})}
    else{add('mate',a[0]+u(-6,6),a[1]+u(3,7));leg(p,a,'pass',u(-8,8));if(t==='save'){leg(a,[keeper[0]+(a[0]<60?-3:3),7.5],'shot',0);seq.push({x:[keeper[0]+(a[0]<60?-3:3),7.5],save:1})}else leg(a,goalPt(a[0]<60?1:-1),'shot',u(-4,4))}}
  // board
  const op=flip?'#FF6B66':'#E6EDF3',we=flip?'#E6EDF3':'#F2C14E';
  let s=`<svg class="sk${static_?' st':''}" viewBox="0 0 120 62" aria-hidden="true"><rect width="120" height="62" rx="5" fill="#0E3B26"/><path d="M0 12h120M0 28h120M0 44h120M0 60h120" stroke="#fff" stroke-opacity=".035" stroke-width="8"/>`+
    `<g fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".6"><rect x="3" y="3" width="114" height="64"/><rect x="24" y="3" width="72" height="28"/><rect x="42" y="3" width="36" height="10"/><path d="M48 31a14 14 0 0 0 24 0"/><rect x="50.5" y=".6" width="19" height="2.4" stroke-opacity=".8"/></g><circle cx="60" cy="23" r=".7" fill="#fff" fill-opacity=".6"/>`;
  let delay=.15,legs='',ballA='';
  for(const g of seq){
    if(g.d){const dur=g.kind==='shot'?.5:.7,cls=g.kind==='shot'?'s':g.kind==='run'?'r':'p';
      legs+=`<path class="sk-${cls}" d="${g.d}" pathLength="1" style="animation-delay:${f(delay)}s;animation-duration:${dur}s"${g.kind==='shot'?` stroke="${flip?op:g.mine?we:'#E6EDF3'}"`:''}/>`;
      if(!static_)ballA+=`<animateMotion begin="${f(delay)}s" dur="${dur}s" fill="freeze" path="${g.d}"/>`;
      ball=g.end;delay+=dur+.1}
    else if(g.x){legs+=g.save?`<path d="M${f(g.x[0]-3)} ${f(g.x[1]-3)}l6 6m0-6l-6 6" stroke="#2FD27C" stroke-width="1.6" class="sk-x" style="animation-delay:${f(delay)}s"/>`:`<path d="M${f(g.x[0]-2.5)} ${f(g.x[1]-2.5)}l5 5m0-5l-5 5" stroke="#2FD27C" stroke-width="1.6" class="sk-x" style="animation-delay:${f(delay)}s"/>`}}
  const dot=(x,y,fill,str,rr)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${rr||2.4}" fill="${fill}" stroke="${str}" stroke-width=".8"/>`;
  s+=P.opp.map(([x,y])=>dot(x,y,flip?'#FF6B66':'#3B4650',flip?'#4a1110':'#9AA7B2')).join('')+P.mate.map(([x,y])=>dot(x,y,flip?'#3B4650':'#E6EDF3',flip?'#9AA7B2':'#0E3B26')).join('')+legs+
    P.me.map(([x,y])=>`<circle cx="${f(x)}" cy="${f(y)}" r="4.6" fill="#F2C14E" fill-opacity=".25"/>`+dot(x,y,'#F2C14E','#3a2a00',2.9)).join('');
  const b=static_&&ball?ball:(seq[0]&&seq[0].d?seq[0].d.match(/^M([\d.]+) ([\d.]+)/).slice(1).map(Number):[60,30]);
  if(static_)s+=`<circle r="1.5" fill="#fff" stroke="#111" stroke-width=".4" cx="${f(b[0])}" cy="${f(b[1])}"/>`;
  else if(ballA)s+=`<circle r="1.5" fill="#fff" stroke="#111" stroke-width=".4" opacity="0"><set attributeName="opacity" to="1" begin=".15s" fill="freeze"/>${ballA}</circle>`;
  return s+'</svg>';
}
function skFig(l,st){return sketchSvg(l.d,st)+`<figcaption><span class="num">${l.m}'</span>${esc(l.t)}</figcaption>`}
function liveSkHtml(m,shown){let l=null;for(let i=Math.min(shown,m.lines.length)-1;i>=0;i--)if(m.lines[i].d){l=m.lines[i];break}return `<figure class="lvsk" id="lvSk" ${l?'':'hidden'}>${l?skFig(l,true):''}</figure>`}

/* ================= chronology of a career: season by season, with the turning points ================= */
function chronoRows(){
  const P=G.P,ss=G.seasons.slice().reverse(),rows=[];let deb=false;
  ss.forEach((s,i)=>{
    const pv=ss[i-1],ev=[];
    if(!pv)ev.push(['start',`Первый контракт: «${s.clubName}»`]);
    else if(s.clubName!==pv.clubName){const t=(P.transfers||[]).find(x=>x.y===s.year&&x.to===s.clubName);
      ev.push(['move',s.loan?`Аренда в «${s.clubName}»`:!t&&pv.loan?`Возвращение в «${s.clubName}»`:t&&t.fee?`Переход в «${s.clubName}» за ${fmtM(t.fee)}`:`Переход в «${s.clubName}»`])}
    if(pv&&s.pos!==pv.pos)ev.push(['pos',`Новая позиция: ${POS[s.pos].n.toLowerCase()}`]);
    if(!deb&&s.intl&&s.intl.apps>0){deb=true;ev.push(['nat',`Дебют за сборную: ${s.natName}`])}
    if(s.captain&&!(pv&&pv.captain))ev.push(['cap','Капитанская повязка']);
    s.trophies.forEach(t=>ev.push(['tro',t]));
    s.awards.filter(a=>!/^(Достижение|Achievement)/.test(a)&&/Золотой мяч|Трофей|бутса|Игрок|бомбардир|Лучший|Yashin|Ballon|Boot|Player/i.test(a)).forEach(a=>ev.push(['aw',a]));
    if(s.bdo&&s.bdo.place>1&&s.bdo.place<=10&&s.pos!=='GK')ev.push(['bdo',`Золотой мяч: ${s.bdo.place}-е место`]);
    (s.records||[]).slice(0,2).forEach(r=>ev.push(['rec',r]));
    if((s.inj||[]).some(n=>n>=10))ev.push(['inj',`Тяжёлая травма: пропущено ~${s.inj.reduce((a,b)=>a+b,0)} матчей`]);
    rows.push({s,ev});
  });
  return rows;
}
const chronoStat=s=>{const c=s.club;return `${c.apps} ${plural(c.apps,'матч','матча','матчей')} · ${s.pos==='GK'?`${c.cs} ${plural(c.cs,'сухой','сухих','сухих')}`:`${c.g} ${plural(c.g,'гол','гола','голов')} · ${c.a} ${plural(c.a,'пас','паса','пасов')}`} · рейтинг ${s.ovrBefore}→${s.ovrAfter}`};
const chronoEnd=()=>{const P=G.P,r=P.retired;if(G.phase!=='retired'||!r)return null;return {y:r.year,age:r.age,t:r.why==='ban'?'Пожизненная дисквалификация':r.why==='form'?'Завершение карьеры: форма уже не та':'Завершение карьеры',f:P.farewell?`Прощальный матч: «${P.farewell.club}», ${P.farewell.score}`:''}};
function viewChrono(){
  const rows=chronoRows(),end=chronoEnd();
  if(!rows.length)return '';

  const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(rise||.3));g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(c.destination);s.start(t);s.stop(t+d)}

const GREAT_KEY='legenda-polya-greats';
function greatsGet(){try{const a=JSON.parse(LS.getItem(GREAT_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function greatEntry(){
  if(isCoach()){const C0=G.C;return {id:G.slot,k:'c',name:C0.name,pos:'ТРЕНЕР',tier:coachTier(),score:r1(coachLegacyScore()),tro:C0.trophies.length,bdo:C0.coty,main:`${C0.seasons.length} сез., ${C0.jobs.length} клубов`,years:`${C0.seasons.length?C0.seasons[C0.seasons.length-1].label.slice(0,4):G.year}–${G.year}`,d:Date.now()}}
  const P=G.P,mp=mainPos(),gk=mp==='GK';
  return {id:G.slot,k:'p',name:P.name,pos:POS[mp].s,tier:legacyTier(),score:r1(legacyScore()),tro:P.trophies.length,bdo:P.awards.filter(a=>a.n===(gk?'Трофей Яшина':'Золотой мяч')).length,
    main:gk?`${P.tot.cs} сухих`:['CB','LB','RB'].includes(mp)?`${P.tot.apps+P.caps} матчей`:`${P.tot.g+P.ig} голов`,years:`${G.seasons.length?G.seasons[G.seasons.length-1].year:G.year}–${G.year}`,d:Date.now()};
}
function greatRecord(){try{if(!G||(!G.P&&!G.C))return;const e=greatEntry(),a=greatsGet().filter(x=>x.id!==e.id);a.push(e);LS.setItem(GREAT_KEY,JSON.stringify(a))}catch(e){}}
/* careers that ended before this table existed are added from their save slots */
function greatsBackfill(){
  const have=new Set(greatsGet().map(x=>x.id)),keep={G,S,RW:RW.s,RPR:RPR.s};
  for(const m of slotsGet()){if(!m.retired||have.has(m.id))continue;
    try{const raw=slotRaw(m.id);if(!raw)continue;G=JSON.parse(raw);G.slot=m.id;S=G.seasons&&G.seasons[0]||null;if(G.P||G.C)greatRecord()}catch(e){}}
  G=keep.G;S=keep.S;RW.s=keep.RW;RPR.s=keep.RPR;
}
function greatsTable(limit){
  const a=greatsGet().sort((x,y)=>y.score-x.score).slice(0,limit||20);
  if(!a.length)return '<p class="muted small">Здесь появятся ваши завершённые карьеры, от лучшей к худшей. Пока ни одна не закончена.</p>';
  return `<div class="tw"><table class="t greats"><thead><tr><th>#</th><th>Имя</th><th>Поз</th><th>Годы</th><th>Очки</th><th>Трофеи</th><th>ЗМ</th><th>Главное</th></tr></thead><tbody>${a.map((x,i)=>`<tr class="${G&&G.slot===x.id?'me':''} ${i<3?'top'+(i+1):''}"><td>${i+1}</td><td><b>${esc(x.name)}</b><br><span class="dim small">${esc(x.tier)}</span></td><td>${esc(x.pos)}</td><td>${esc(x.years)}</td><td>${x.score}</td><td>${x.tro}</td><td>${x.k==='c'?'—':x.bdo}</td><td style="font-family:var(--body)">${esc(x.main)}</td></tr>`).join('')}</tbody></table></div>`;
}

  if(!c||!mine||!c.c||c.c.length!==G.clubs.length||c.n.length!==G.nations.length||c.l.length!==G.leagues.length)return false;
  G.clubs.forEach((cl,i)=>{const [s,b,lg]=c.c[i],[ms,mb]=mine.c[i];cl.str=clamp(s+(cl.str-ms),42,94);cl.base=b+(cl.base-mb);cl.lg=lg});

function h2hData(a,b){
  const A=a.progress,B=b.progress,ha=(A.h2h||{})[b.id],hb=(B.h2h||{})[a.id];

  let m=null;if(a.id<b.id){if(ha)m={w:ha.w,d:ha.d,l:ha.l,gf:ha.gf,ga:ha.ga}}else if(hb)m={w:hb.l,d:hb.d,l:hb.w,gf:hb.ga,ga:hb.gf};
  let aw=0,bw=0;for(const y in (A.places||{}))if(B.places&&B.places[y]!=null){if(A.places[y]<B.places[y])aw++;else if(B.places[y]<A.places[y])bw++}
  const gk=A.gk&&B.gk;
  const rows=[
    ['Очные матчи (победы)',m?m.w:0,m?m.l:0,1,m?`${m.w}–${m.d}–${m.l}, мячи ${m.gf}:${m.ga}`:'не встречались'],
    ['Голы в очных матчах',(ha||{}).g||0,(hb||{}).g||0,1],
    ['Выше в Золотом мяче, сезонов',aw,bw,1],
    ['Очки наследия',A.score||0,B.score||0,1],
    ['Трофеи',A.tro,B.tro,1],
    [gk?'Трофеи Яшина':'Золотые мячи · Яшины',A.bdo,B.bdo,1],
    ['Лучшее место в Золотом мяче',A.best||99,B.best||99,-1],
    ['Пик рейтинга',A.peak||A.ovr,B.peak||B.ovr,1],
    ['Матчи',A.apps||0,B.apps||0,1],
    ...(gk?[['Сухие матчи',A.cs||0,B.cs||0,1]]:[['Голы',A.g,B.g,1]]),
    ['Передачи',A.a,B.a,1],
    ['Матчи за сборную',A.caps||0,B.caps||0,1],
  ];
  let sa=0,sb=0;rows.forEach(r=>{const d=(r[1]-r[2])*r[3];if(d>0)sa++;else if(d<0)sb++});
  return {rows,sa,sb,m};
}

const SQUAD_POS=['GK','GK','GK','CB','CB','CB','CB','LB','LB','RB','RB','CDM','CDM','CM','CM','CM','CAM','CAM','LW','LW','RW','RW','ST','ST','ST'];
const SCHEMES={'4-3-3':['GK','LB','CB','CB','RB','CDM','CM','CM','LW','ST','RW'],'4-2-3-1':['GK','LB','CB','CB','RB','CDM','CDM','CAM','LW','RW','ST'],'4-4-2':['GK','LB','CB','CB','RB','LW','CM','CM','RW','ST','ST'],'3-5-2':['GK','CB','CB','CB','LB','RB','CDM','CM','CAM','ST','ST'],'5-3-2':['GK','LB','CB','CB','CB','RB','CDM','CM','CM','ST','ST']};

const FIT_GROUP={GK:'G',CB:'D',LB:'F',RB:'F',CDM:'M',CM:'M',CAM:'A',LW:'W',RW:'W',ST:'S'};
function fitPenalty(pl,slot){if(pl===slot)return 0;const a=FIT_GROUP[pl],b=FIT_GROUP[slot];if(a===b)return 2;const near={D:'MF',F:'DW',M:'DA',A:'MSW',W:'FAS',S:'AW'};if(a==='G'||b==='G')return 30;return (near[a]||'').includes(b)?5:12}
let PID=1;
function mkPlayer(pos,ovr,age,o={}){return {id:o.id||('p'+Date.now().toString(36)+(PID++)),name:o.name||(o.nm||nameUV.bind(null,null))(R(),R()),pos,age,ovr:r1(clamp(ovr,40,95)),pot:Math.round(clamp(o.pot||ovr+Math.max(0,(24-age))*ri(1,3),ovr,96)),contract:o.contract||ri(1,4),star:!!o.star,academy:!!o.academy,inj:0,apps:0,g:0,a:0}}
function genSquad(club){
  const base=club.str-2,stars=G.rivals.filter(r=>r.club===club.id),used=new Set(),sq=[];
  stars.forEach(r=>{sq.push(mkPlayer(r.pos,r.ovr,G.year+1-r.by,{name:r.name,star:true,pot:r.pot}));used.add(r.pos)});
  const need=SQUAD_POS.slice();stars.forEach(r=>{const i=need.indexOf(r.pos);if(i>=0)need.splice(i,1)});
  // first choice per position is close to the club level, depth is weaker
  const seen={};
  need.forEach(pos=>{const k=(seen[pos]=(seen[pos]||0)+1);const lvl=base+(k===1?ri(-2,2):k===2?ri(-6,-2):ri(-12,-6));sq.push(mkPlayer(pos,lvl,ri(19,32),{nm:(u,v)=>clubNameUV(club,u,v)}))});
  return sq;
}
function bestXI(sq,scheme){
  const slots=SCHEMES[scheme].slice(),pool=sq.filter(p=>!p.inj&&!p.rest),xi=[];
  const order=slots.map((s,i)=>[s,i]).sort((a,b)=>(a[0]==='GK'?-1:0)-(b[0]==='GK'?-1:0));
  for(const [slot] of order){let best=null,bv=-1;for(const p of pool){if(xi.includes(p))continue;const v=p.ovr-fitPenalty(p.pos,slot);if(v>bv){bv=v;best=p}}if(best)xi.push({p:best,slot,eff:bv})}
  const avg=xi.length?xi.reduce((s,x)=>s+x.eff,0)/11:50;
  return {xi,avg};
}
function squadStrength(){
  const C0=G.C,sq=C0.squad,xi=bestXI(sq,C0.tactic.scheme);
  const depth=sq.filter(p=>!p.inj).sort((a,b)=>b.ovr-a.ovr).slice(11,18).reduce((s,p)=>s+p.ovr,0)/7;
  return {base:xi.avg+2+clamp((depth-xi.avg+8)*.08,-1,.6),xi};
}

function jobOffers(n){
  const C0=G.C,top=55+C0.rep*.38,low=top-12;
  let pool=G.clubs.filter(c=>c.str<=top&&c.str>=low&&c.id!==C0.clubId&&allowedClub(c.id));
  if(pool.length<n)pool=G.clubs.filter(c=>c.id!==C0.clubId).sort((a,b)=>Math.abs(a.str-top+4)-Math.abs(b.str-top+4)).slice(0,12);
  const out=[];for(let i=0;i<n&&pool.length;i++){const c=wpick(pool,c=>Math.exp(-Math.abs(c.str-(top-4))/4));pool.splice(pool.indexOf(c),1);out.push(c)}
  return out;
}
function prestige(c){return (c.init||c.str)+Math.log(Math.max(1,LG(c.lg).wealth))*1.5}
function budgetFor(c){const lg=LG(c.lg);return r1(Math.max(1,Math.exp(((c.init||c.str)-60)*.12)*lg.wealth*.55))}
function jobOffersDecision(first){
  const C0=G.C,offers=jobOffers(first?3:ri(2,3));
  const opts=offers.map(c=>{const lg=LG(c.lg),b=budgetFor(c),yrs=ri(2,4);return {label:c.name,sub:`${lg.name} · сила ${Math.round(c.str)}`,detail:`Бюджет на трансферы ${fmtM(b)} · контракт ${yrs} ${plural(yrs,'год','года','лет')}`,badges:compBadges(c.id),act:{t:'cfx',job:{club:c.id,years:yrs,budget:b}}}});
  if(!first)opts.push({label:'Подождать',sub:'Отдохнуть полсезона',detail:'Предложения придут снова',act:{t:'cfx',log:'Вы решили подождать с новой работой.'}});
  return {club:false,title:first?'Первая работа':'Предложения работы',body:`Репутация ${Math.round(C0.rep)} (${repLabel(C0.rep)}). Эти клубы готовы доверить вам команду.`,opts};
}

function natQualList(Y,conf){

function* natQualifiers(){

}

/* ================= anonymous stats & online counter =================
   No ids, no personal data: the browser itself says "first visit today" once a day; a throwaway token per tab
   (kept in this tab only) lets the server count who is online right now — it forgets it after 2.5 minutes. */
const STAT={tab:null,online:null,queue:[],t:null};
function statTab(){if(STAT.tab)return STAT.tab;try{STAT.tab=SS.getItem('legenda-polya-tab')}catch(e){}
  if(!STAT.tab){STAT.tab=Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2,8);try{SS.setItem('legenda-polya-tab',STAT.tab)}catch(e){}}return STAT.tab}
function statPing(ev){
  if(typeof document==='undefined'||!document.body)return;
  if(ev){STAT.queue.push(ev);clearTimeout(STAT.t);STAT.t=setTimeout(()=>statPing(),1500);return}
  if(document.visibilityState==='hidden')return;
  let neu=0;try{const d=new Date().toISOString().slice(0,10);if(LS.getItem('legenda-polya-seen')!==d){LS.setItem('legenda-polya-seen',d);neu=1}}catch(e){}
  const evs=STAT.queue.splice(0);
  api('/hi',{tab:statTab(),new:neu,lang:LANG,ev:evs[0]||null}).then(r=>{const first=!STAT.online&&r.online;STAT.online=r.online;if(first&&!document.querySelector('[data-online]')&&(UI.tab==='home'||UI.tab==='multi'||!G))render();const el=document.querySelectorAll('[data-online]');el.forEach(x=>x.textContent=String(r.online))}).catch(()=>{});
  evs.slice(1).forEach(e=>api('/hi',{tab:statTab(),ev:e}).catch(()=>{}));
}
const onlineBadge=()=>STAT.online?`<span class="online" title="Сейчас играют"><i></i>онлайн: <b data-online>${STAT.online}</b></span>`:'';

/* ================= the game moved to legendapolya.com =================
   Old addresses (GitHub Pages, the sslip mirror) send players to the new domain. Saves live per site in the browser,
   so a player who has careers there carries them over: the old page opens the new site and hands the saves over by
   postMessage; the new site merges them with what it already has (nothing is overwritten). */
const MOVED_TO='https://legendapolya.com';
const OLD_SITES=['https://l3thily.github.io','https://legenda-polya.88-218-121-40.sslip.io'];
const SAVE_KEYS=k=>k.startsWith('legenda-polya')&&!/-(tab|adtest|banner|api|adx|seen|consent|tidy1)$/.test(k);
function oldSite(){try{return OLD_SITES.includes(location.origin)&&!LS.getItem('legenda-polya-stay')}catch(e){return false}}
function movedTarget(){try{return MOVED_TO+'/'+location.search+location.hash}catch(e){return MOVED_TO}}
function moveDump(){const o={};try{for(let i=0;i<LS.length;i++){const k=LS.key(i);if(SAVE_KEYS(k))o[k]=LS.getItem(k)}}catch(e){}return o}
function moveHasSaves(){try{return slotsGet().length>0||!!LS.getItem(SAVE)||greatsGet().length>0}catch(e){return false}}
function moveView(){
  return `<section class="moved"><p class="eyebrow">Легенда поля</p><h1 class="disp">Игра переехала на <em>legendapolya.com</em></h1>
    <p class="lead">Новый адрес — быстрее и надёжнее. Ваши карьеры, достижения и рекорды хранятся в этом браузере: нажмите кнопку, и мы перенесём их на новый сайт.</p>
    <div class="go"><button class="btn primary" data-a="moveGo">Перенести сохранения и открыть</button><a class="btn ghost" href="${MOVED_TO}/">Открыть без сохранений</a></div>
    ${UI.moveMsg?`<p class="note">${esc(UI.moveMsg)}</p>`:''}</section>`;
}
function moveGo(){
  const w=window.open(MOVED_TO+'/?import=1','_blank');
  if(!w){location.href=MOVED_TO+'/';return}
  const data=moveDump();UI.moveMsg='Открываем новый сайт…';render();
  const onMsg=e=>{if(e.origin!==MOVED_TO||!e.data)return;
    if(e.data.type==='lp-ready')w.postMessage({type:'lp-import',data},MOVED_TO);
    if(e.data.type==='lp-imported'){window.removeEventListener('message',onMsg);UI.moveMsg=`Готово: перенесено карьер — ${e.data.slots}. Играйте на новом сайте, эту вкладку можно закрыть.`;render()}};
  window.addEventListener('message',onMsg);
}
/* new site: accept saves from the old addresses only, merge without overwriting */
function moveImport(data){
  const get=k=>{try{return JSON.parse(LS.getItem(k)||'null')}catch(e){return null}},set=(k,v)=>{try{LS.setItem(k,typeof v==='string'?v:JSON.stringify(v))}catch(e){}};
  let slots=0;
  for(const [k,v] of Object.entries(data||{})){
    if(!SAVE_KEYS(k)||typeof v!=='string')continue;
    if(k===SLOTS_KEY){const mine=slotsGet(),ids=new Set(mine.map(m=>m.id));let add=[];try{add=JSON.parse(v).filter(m=>m&&m.id&&!ids.has(m.id))}catch(e){}slots+=add.length;set(k,mine.concat(add))}
    else if(k===GREAT_KEY){const mine=greatsGet(),ids=new Set(mine.map(m=>m.id));let add=[];try{add=JSON.parse(v).filter(m=>m&&!ids.has(m.id))}catch(e){}set(k,mine.concat(add))}
    else if(k===ACH_KEY){const mine=get(k)||{};let o={};try{o=JSON.parse(v)||{}}catch(e){}set(k,Object.assign({},o,mine))}
    else{try{if(LS.getItem(k)==null)LS.setItem(k,v)}catch(e){}}
  }
  return slots;
}
function moveListen(){
  try{if(location.origin!==MOVED_TO||!new URLSearchParams(location.search).has('import')||!window.opener)return}catch(e){return}
  window.addEventListener('message',e=>{if(!OLD_SITES.includes(e.origin)||!e.data||e.data.type!=='lp-import')return;
    const n=moveImport(e.data.data);try{e.source.postMessage({type:'lp-imported',slots:n},e.origin)}catch(err){}
    try{history.replaceState(null,'',location.pathname)}catch(err){}
    location.reload()});
  OLD_SITES.forEach(o=>{try{window.opener.postMessage({type:'lp-ready'},o)}catch(e){}});
}

  else if(a==='pickFace'){UI.form.face=b.dataset.v;UI.form.faceMan=true;render()}
  else if(a==='faceReg'){UI.faceReg=b.dataset.v;render()}
  else if(a==='faceRnd'){const p=UI.faceReg&&UI.faceReg!=='fit'?(UI.faceReg==='all'?FACE_ALL:FACE_REG[UI.faceReg].map(faceId)):facePool(UI.form.nat);UI.form.face=p[Math.floor(Math.random()*p.length)];UI.form.faceMan=true;render()}
  else if(a==='farewell'){if(!RUN&&G&&G.P&&!G.P.farewell){RUN=farewellGen();stepSeason()}}
  else if(a==='lang'){setLang(EN?'ru':'en')}
  else if(a==='consentAll'){consentSet('all')}
  else if(a==='consentMin'){consentSet('min')}
  else if(a==='consentReset'){if(consentGet()==='all'&&ADS.loaded){consentSet('min');location.reload()}else{UI.cookies=true;render()}}
  else if(a==='adRew'){if(!RUN&&G&&G.P&&G.adRewY!==G.year)adsRewarded(()=>{const b=adBonus();G.P.earn+=b*1e6;G.adRewY=G.year;UI.shopMsg=`Рекламная интеграция: +${fmtM(b)}.`;save();render()})}
  else if(a==='snd'){SND.on=!SND.on;try{LS.setItem('legenda-polya-snd',SND.on?'1':'0')}catch(err){}render();if(SND.on)sfx('coin')}
  else if(a==='lvSkip'){if(UI.live)UI.live.n=1e9;liveTick()}
  else if(a==='paperOk'){G.paperSeen=G.seasons[0].label;save();render()}
  else if(a==='shop'){shopAct(b.dataset.k,b.dataset.id)}
  else if(a==='play'){sfx('whistle');if(inRoom())mpSeasonGo();else beginSeason()}
  else if(a==='mpSkip'){if(UI.wait)UI.wait.skip=true;else if(MATCH)MATCH.skip=true}
  else if(a==='h2hGo'){if(MATCH&&MATCH.kind==='h2h')mpH2HGo(MATCH)}
  else if(a==='mopt'){stepSeason(+b.dataset.i)}
  else if(a==='opt'){chooseOpt(+b.dataset.i)}
  else if(a==='new'){UI.confirmNew=true;render()}
  else if(a==='newNo'){UI.confirmNew=false;render()}
  else if(a==='newYes'){UI.confirmNew=false;dropEmpty();G=null;RUN=null;MATCH=null;UI.wait=null;UI.tab='career';try{LS.removeItem(ACTIVE_KEY)}catch(err){}render();window.scrollTo(0,0)}
  else if(a==='slotLoad'){if(loadSlot(b.dataset.id)){UI.tab='career';render();window.scrollTo(0,0)}}
  else if(a==='slotDel'){UI.delSlot=b.dataset.id;render()}
  else if(a==='slotDelYes'){deleteSlot(UI.delSlot);UI.delSlot=null;render()}
  else if(a==='slotDelNo'){UI.delSlot=null;render()}
  else if(a==='ret'){UI.confirmRetire=true;render()}
  else if(a==='retNo'){UI.confirmRetire=false;render()}
  else if(a==='cer'){G.ceremony=false;save();render();window.scrollTo(0,0)}
  else if(a==='share'){openShare(b.dataset.v)}
  else if(a==='shareClose'){UI.share=null;render()}
  else if(a==='shareNative'){const f=new File([UI.share.blob],'legenda.png',{type:'image/png'});navigator.share({files:[f],title:EN?'Legend of the Pitch':'Легенда поля'}).catch(()=>{})}
  else if(a==='mpCreate'){mpCreate()}
  else if(a==='mpInvite'){mpInvite(b)}
  else if(a==='chalStart'){startChallenge(b.dataset.v,b.dataset.id)}
  else if(a==='lbSend'){lbSend()}
  else if(a==='moveGo'){moveGo()}
  else if(a==='load'){if(G&&G.P&&!RUN){G.P.load=b.dataset.v;save();render()}}
  else if(a==='shareRes'){shareResult(b)}
  else if(a==='mpSwitchNo'){UI.mpSwitch=false;render()}
  else if(a==='mpSwitchGo'){UI.mpSwitch=false;const code=UI.mpCode;MP.sess=null;MP.room=null;mpSave();UI.mpCode=code;mpJoin()}
  else if(a==='mpQr'){UI.mpQr=!UI.mpQr;render()}
  else if(a==='mpEmo'){mpSay(b.dataset.v)}
  else if(a==='mpJoinCode'){UI.mpCode=b.dataset.v;mpJoin()}
  else if(a==='mpJoin'){mpJoin()}
  else if(a==='mpReady'){mpReady()}
  else if(a==='mpStart'){mpStartNow()}
  else if(a==='mpLeave'){mpLeave()}
  else if(a==='mpBegin'){mpBegin()}
  else if(a==='mpCopy'){const t=MP.sess?MP.sess.code:'';try{navigator.clipboard.writeText(t).then(()=>{b.textContent='Скопировано'},()=>{b.textContent=t})}catch(err){b.textContent=t}}
  else if(a==='setMode'){UI.form.mode=b.dataset.v;render()}
  else if(a==='toChal'){UI.form.mode='chal';dropEmpty();G=null;RUN=null;MATCH=null;UI.wait=null;UI.tab='career';try{LS.removeItem(ACTIVE_KEY)}catch(err){}render();window.scrollTo(0,0)}
  else if(a==='cPlay'){beginCoachHalf()}
  else if(a==='cSell'){sellPlayer(b.dataset.id);render()}
  else if(a==='cDrop'&&isCoach()){if(G.C.squad.length>18){const p=G.C.squad.find(x=>x.id===b.dataset.id);G.C.squad=G.C.squad.filter(x=>x!==p);UI.cMsg=p?`${p.name} больше не вызывается.`:null;save()}else UI.cMsg='Меньше 18 игроков оставлять нельзя.';render()}
  else if(a==='cBuy'){buyPlayer(b.dataset.id,b.dataset.m);render()}
  else if(a==='cRetYes'){UI.confirmRetire=false;coachRetire('choice');render();window.scrollTo(0,0)}
  else if(a==='toCoach'){startCoach(true)}
  else if(a==='retYes'){UI.confirmRetire=false;doRetire('choice');render();window.scrollTo(0,0)}
});
document.addEventListener('input',e=>{
  const id=e.target.id,f=UI.form;
  if(id==='f-name'){f.name=e.target.value;updPrev()}
  else if(id==='f-num'){f.num=e.target.value;updPrev()}
  else if(id==='m-name'||id==='m-name2'){f.name=e.target.value;mpPushSetupSoon()}
  else if(id==='m-num'){f.num=e.target.value;mpPushSetupSoon()}
  else if(id==='m-code'){UI.mpCode=e.target.value.toUpperCase()}
  else if(id==='m-pub'){UI.mpPublic=e.target.checked}
  else if(id==='f-hard'){UI.form.hard=e.target.checked}
  else if(id==='lb-nick'){UI.lbNick=e.target.value}
});
document.addEventListener('change',e=>{
  const id=e.target.id,f=UI.form;
  if(id==='f-nat'){f.nat=e.target.value;if(!f.faceMan)f.face=faceFor(f.nat,hashStr(f.name||'x'));render()}
  else if(id==='f-pos'){f.pos=e.target.value;f.num=NUM_BY_POS[f.pos];const n=document.getElementById('f-num');if(n)n.value=f.num;updPrev()}
  else if(id==='f-lg'){f.lg=e.target.value;f.club=S_LEAGUES.find(l=>l.id===f.lg).clubs[0].name;render()}
  else if(id==='f-club'){f.club=e.target.value;updPrev()}
  else if(id==='f-rus'){f.rus=e.target.value}
  else if(id==='f-nat2'){f.nat2=e.target.value}
  else if(id==='f-cage'){f.cage=+e.target.value}
  else if(id==='cScheme'&&isCoach()){G.C.tactic.scheme=e.target.value;save();render()}
  else if(id==='cStyle'&&isCoach()){G.C.tactic.style=e.target.value;save();render()}
  else if(id==='tblLg'){UI.tblLg=e.target.value;UI.tblHalf=0;render()}
  else if(id==='focus'&&G&&G.P){G.P.focus=e.target.value;save()}
  else if(id==='m-nat'){f.nat=e.target.value;if(f.nat2===f.nat)f.nat2='';mpPushSetupSoon();render()}
  else if(id==='m-nat2'){f.nat2=e.target.value;mpPushSetupSoon()}
  else if(id==='m-pos'){f.pos=e.target.value;f.num=NUM_BY_POS[f.pos];mpPushSetupSoon();render()}
  else if(id==='m-lg'){f.lg=e.target.value;f.club=S_LEAGUES.find(l=>l.id===f.lg).clubs[0].name;mpPushSetupSoon();render()}
  else if(id==='m-club'){f.club=e.target.value;mpPushSetupSoon()}
  else if(id==='m-rus'){if(MP.sess&&MP.room&&MP.room.host===MP.sess.pid)mpHostRus(e.target.value);else f.rus=e.target.value}
});
document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();const i=document.getElementById('m-chat');if(i){mpSay(i.value);i.value=''}return}if(e.target.id==='setupForm'){e.preventDefault();startCareer()}else if(e.target.id==='coachForm'){e.preventDefault();startCoach(false)}});
function updPrev(){const f=UI.form,el=document.getElementById('cardPrev');if(el)el.innerHTML=playerCard({ovr:'??',pos:POS[f.pos].s,age:17,num:f.num,name:f.name||'Игрок',club:f.club,nat:f.nat,posFull:POS[f.pos].n,face:f.mode==='coach'?null:f.face})}

];
function newsCheck(){try{if(LS.getItem(NEWS_KEY)===NEWS_V)return;if(slotsGet().length||G)UI.news=true;else LS.setItem(NEWS_KEY,NEWS_V)}catch(e){}}
function newsClose(){UI.news=false;try{LS.setItem(NEWS_KEY,NEWS_V)}catch(e){}render()}
function newsView(){

    <p class="small muted" style="margin:0">Новые лиги появятся в новых карьерах. Текущие карьеры продолжаются с новыми регламентами и турнирами.</p>
    <div class="go" style="margin-top:4px"><button class="btn primary" data-a="newsGo">Создать новую карьеру</button><button class="btn ghost" data-a="newsX">Продолжить свою</button></div></div></div>`;

/* ================= boot ================= */
function start(data){
  moveListen();
  if(oldSite()&&!YG){if(!moveHasSaves()){location.replace(movedTarget());return}UI.moved=true}
  if(data&&data.Gs)G=migrate(JSON.parse(data.Gs));else if(data&&data.G)G=migrate(data.G);else{slotsTidy();const s=load();if(s&&(s.P||s.C)&&s.clubs)G=migrate(s)}
  if(G)SAVED=saveJSON(G);
  if(G&&G.room&&G.room.token&&!MP.sess){MP.sess={code:G.room.code,pid:G.room.pid,token:G.room.token};mpSave()}
  if(data&&data.UI)Object.assign(UI,data.UI);
  else if(!G&&slotsGet().length)UI.tab='home';
  try{const q=new URLSearchParams(location.search).get('room');if(q&&/^[A-Z0-9]{4,6}$/i.test(q)){UI.mpCode=q.toUpperCase();UI.tab='multi';if(MP.sess&&MP.sess.code!==UI.mpCode)UI.mpSwitch=true;history.replaceState(null,'',location.pathname)}}catch(e){}
  adsLoad();
  newsCheck();
  render();
  try{bannerMount()}catch(e){}
  statPing();setInterval(()=>statPing(),60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')statPing()});
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({Gs:SAVED,UI:{tab:UI.tab,tblLg:UI.tblLg,form:UI.form}}))}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
