<script>
/* boot guard: if the game hasn't started in 9 s, say so on the splash and send the errors (no personal data) for diagnosis */
(function(){var errs=[];
window.addEventListener('error',function(e){errs.push(String(e.message||'error').slice(0,160)+' @'+String(e.filename||'').split('/').pop()+':'+(e.lineno||0))});
window.addEventListener('unhandledrejection',function(e){var r=e.reason;errs.push('promise: '+String(r&&r.message||r).slice(0,160))});
setTimeout(function(){var a=document.getElementById('app');if(!a||!a.querySelector('.splash'))return;
var s=a.querySelector('.splash span');if(s)s.innerHTML='Игра не запустилась · The game did not start<br><button onclick="location.reload()" style="margin:12px 0;padding:10px 18px;border-radius:12px;border:0;background:#F2C14E;font-weight:700">Перезагрузить · Reload</button><br><small style="text-transform:none;letter-spacing:0">Откройте в Chrome или Safari или отключите блокировщик рекламы для сайта</small>';
try{var x=new XMLHttpRequest();x.open('POST','/api/oops');x.setRequestHeader('Content-Type','application/json');x.send(JSON.stringify({e:errs.slice(0,5),ua:String(navigator.userAgent||'').replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').slice(0,140)}))}catch(e){}
},9000)})();
</script>

<style>
/* Layout: a night match under floodlights. Broadcast graphics over a dark pitch, gold reserved for glory, a cream newspaper as the one warm surface. */
:root{
  --bg:#070D12;--bg2:#0B151C;--card:#0E1A22;--card2:#13232D;--glass:rgba(14,27,35,.84);--line:#1A2D38;--line2:#2A4654;

}

    radial-gradient(90% 50% at 50% 115%,rgba(47,210,124,.13),transparent 70%),

.goals{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}.goals li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline}.goals .tier{color:var(--gold);font-size:10px;letter-spacing:1px}.goals em{font-style:normal;color:var(--muted);font-size:12px;white-space:nowrap}.goals li.ok b{color:var(--turf)}.goals li.ok em{color:var(--turf)}
.chal-grid{display:grid;gap:16px;margin-top:20px}.chal-grid .day h2{font-size:clamp(30px,5vw,44px);margin:4px 0 8px;color:var(--gold)}
.scen{display:grid;gap:8px}.scen-i{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.scen-i span,.scen-i em{grid-column:1;font-size:13px;color:var(--muted)}.scen-i em{font-style:normal;color:var(--sky)}.scen-i button{grid-column:2;grid-row:1/4}
.lb{list-style:none;counter-reset:lb;margin:10px 0 0;padding:0;display:grid;gap:4px}.lb li{counter-increment:lb;display:grid;grid-template-columns:28px 1fr auto;gap:0 8px;align-items:center;border-bottom:1px solid var(--line);padding:5px 0}.lb li::before{content:counter(lb);grid-row:1/3;color:var(--dim);font:700 13px var(--mono)}.lb li span{grid-column:2;font-size:12px;color:var(--muted)}.lb li em{grid-column:3;grid-row:1/3;font-style:normal;color:var(--gold)}.lb li.me b{color:var(--gold)}
.spbar{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);z-index:40;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 40px 6px 12px;background:#070D12;border-top:1px solid var(--line)}
.spbar .sp-house img{display:block;max-height:90px;max-width:min(728px,100%);width:auto;height:auto;border-radius:8px}.spbar .adsbygoogle{width:100%;max-width:728px;height:90px}
.sp-mark{margin:0;font-size:10px;line-height:1.2;color:var(--dim)}.sp-x{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--muted);font-size:15px;line-height:1;cursor:pointer}
body.has-sp{padding-bottom:120px}
@media (max-width:760px){.spbar{bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:5px 36px 4px 8px}.spbar .sp-card{padding:6px 8px;gap:8px}.spbar .sp-ic svg{width:28px;height:28px}.spbar .sp-t b{font-size:16px}.spbar .sp-t span{display:none}.spbar .sp-go{padding:8px 10px;font-size:11px}.sp-x{top:50%;transform:translateY(-50%);right:6px}.spbar .sp-house img{max-height:60px}.spbar .adsbygoogle{height:60px}body.has-sp{padding-bottom:140px}}
.load{display:grid;gap:6px;justify-items:start;margin:4px 0 6px}.load .seg{margin-top:0}
.online{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:2px 8px;border:1px solid rgba(47,210,124,.45);border-radius:999px;color:var(--turf);letter-spacing:.04em;text-transform:none}.online i{width:7px;height:7px;border-radius:50%;background:var(--turf);box-shadow:0 0 8px var(--turf)}.online b{color:var(--text)}
.sp-card{display:flex;align-items:center;gap:12px;width:100%;max-width:728px;min-width:0;text-decoration:none;color:var(--text);background:linear-gradient(90deg,rgba(42,171,238,.14),rgba(14,26,34,.9));border:1px solid rgba(42,171,238,.45);border-radius:14px;padding:8px 12px}
.sp-card:hover{border-color:#2AABEE}.sp-ic svg{width:36px;height:36px;display:block}.sp-t{display:grid;gap:0;min-width:0;flex:1}.sp-t b{font-family:var(--disp);font-size:20px;letter-spacing:.02em;text-transform:uppercase}.sp-t span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sp-t em{font-style:normal;font-size:12px;color:#7cc8f0}.sp-go{flex:none;pointer-events:none;font:800 12px/1 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:10px;padding:9px 12px}
.sp-card.big{max-width:none;padding:14px 16px}.sp-card.big .sp-ic svg{width:48px;height:48px}.sp-card.big .sp-go{padding:11px 16px;font-size:13px}.sp-card.big .sp-t span{white-space:normal}
.podium{list-style:none;margin:0;padding:0;display:grid;gap:6px}.podium li{display:grid;grid-template-columns:34px 1fr auto;gap:0 10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px}.podium .m{grid-row:1/3;font-size:22px}.podium li span:not(.m){grid-column:2;font-size:12px;color:var(--muted)}.podium em{grid-column:3;grid-row:1/3;font-style:normal;color:var(--gold);font-size:18px}.podium .p1{border-color:rgba(242,193,78,.6);background:rgba(242,193,78,.07)}
.moved{max-width:720px;margin:40px auto;text-align:left}.moved h1{font-size:clamp(40px,7vw,72px);line-height:.95;margin:6px 0 14px}.moved h1 em{color:var(--gold);font-style:normal}

.splash i{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gold2),var(--gold) 45%,var(--gold3));box-shadow:0 0 30px rgba(242,193,78,.35);animation:spl 1.2s var(--ease) infinite alternate}

@media (max-width:600px){.seg .tab{padding-inline:10px;font-size:13px}}
.cookie{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;max-width:640px;margin:0 auto;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.5);font-size:14px}
.cookie p{margin:0}.cookie a,.foot a{color:var(--sky)}
.foot{flex-wrap:wrap}
@media (max-width:760px){.cookie{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
.age-mark{font:700 12px/1 var(--mono);border:1.5px solid currentColor;border-radius:6px;padding:4px 6px}
.btn.snd{width:44px;padding:0;color:var(--muted)}
.btn.snd[aria-pressed="true"]{color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line2);background:linear-gradient(180deg,var(--card2),var(--card));padding:10px 16px;cursor:pointer;font-weight:600;text-decoration:none;transition:border-color .2s,transform .15s var(--ease),box-shadow .2s}
.btn:hover{border-color:var(--gold)}

.btn.primary{position:relative;overflow:hidden;background:linear-gradient(180deg,#FFD978 0%,var(--gold) 55%,#E0A93A 100%);color:var(--ink);border:0;font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:25px;letter-spacing:.03em;padding:13px 26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 30px -10px rgba(242,193,78,.7),0 0 0 1px rgba(0,0,0,.25)}

.btn[disabled]{opacity:.45;pointer-events:none}

main{padding-block:30px 90px;display:grid;gap:30px}
main>*,.grid2>*,.hero>*,.setup>*,.hof>*,.cer>*,.nem>*,.decide>*,.panel,.season,.status,.act,.tw{min-width:0}
.chart{max-width:100%;width:100%;height:auto;display:block}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:48px;align-items:start}
.hero-t{font-size:clamp(56px,9.5vw,118px);line-height:.86}
.hero-t em{font-style:italic;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.lead{max-width:60ch;color:var(--muted);margin:16px 0 0}
.form{display:grid;gap:14px;margin-top:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row2.namerow{grid-template-columns:minmax(0,1fr) 96px}
.field{display:grid;gap:6px}
.field label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field select{background:rgba(11,21,28,.8);border:1px solid var(--line2);border-radius:12px;padding:12px 13px;width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(242,193,78,.15)}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:13.5px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--gold)}
.facts{display:flex;gap:26px;flex-wrap:wrap;margin-top:24px}
.facts div{display:grid}
.facts b{font-family:var(--disp);font-size:40px;font-weight:900;color:var(--gold);line-height:1}
.facts span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
#cardPrev{display:grid;justify-items:center;padding-top:10px}
/* player card portrait */
.fc-ph{position:absolute;left:24%;right:-4%;top:4%;bottom:20%;pointer-events:none}
.fc-face{width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 14px 18px rgba(0,0,0,.28)) saturate(.92) contrast(1.04);-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent 98%);mask-image:linear-gradient(180deg,#000 70%,transparent 98%)}
.fcard.has-face .fc-top{flex-direction:column;align-items:flex-start;max-width:34%}
.fcard.has-face .fc-age{text-align:left;margin-top:12px;display:grid;gap:0}
.fcard.has-face .fc-age b{font-size:30px}
.fcard.has-face .fc-num{font-size:20px;margin-top:2px}
.fcard .fc-top,.fcard .fc-name,.fcard .fc-meta{z-index:1}
.fcard.has-face .fc-name{padding:16px var(--fcp,22px) 0;margin-inline:calc(-1 * var(--fcp,22px));background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--c2) 94%,transparent) 55%)}
.fcard.has-face .fc-meta{margin:0 calc(-1 * var(--fcp,22px)) calc(-1 * var(--fcp,22px));padding:8px var(--fcp,22px) var(--fcp,22px);background:color-mix(in srgb,var(--c2) 94%,transparent)}
/* new career: shared bits */
.field .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field .lbl b{color:var(--text);letter-spacing:.06em}
.chipb{border:1px solid var(--line2);background:rgba(11,21,28,.8);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted);cursor:pointer;min-height:34px}
.chipb[aria-pressed="true"]{color:var(--ink);background:var(--gold);border-color:var(--gold);font-weight:700}
/* portrait picker */
.fp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fp-ages{display:flex;gap:10px}
.fp-ages figure{margin:0;display:grid;justify-items:center;gap:2px}
.fp-age{width:74px;height:92px;object-fit:cover;object-position:top;border-radius:12px;background:radial-gradient(80% 70% at 50% 30%,#22394a,#0b151c);box-shadow:inset 0 0 0 1px var(--line2)}
.fp-ages figcaption{font-size:11px;color:var(--dim)}
.fp-reg{display:flex;flex-wrap:wrap;gap:6px}
.fp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;max-height:212px;overflow-y:auto;padding:2px;scrollbar-width:thin}
.fp-i{padding:0;border:0;border-radius:10px;background:radial-gradient(80% 70% at 50% 30%,#1d3342,#0b151c);cursor:pointer;aspect-ratio:4/5;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s var(--ease),box-shadow .15s}
.fp-i:hover{transform:translateY(-2px)}
.fp-i[aria-selected="true"]{box-shadow:inset 0 0 0 2px var(--gold),0 0 18px rgba(242,193,78,.35)}
.fp-img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
/* position on a pitch */
.pp{position:relative;aspect-ratio:100/50;max-height:250px;width:100%;border-radius:14px;background:repeating-linear-gradient(90deg,#123b26 0 10%,#0f3420 10% 20%);box-shadow:inset 0 0 0 1px rgba(47,210,124,.25),inset 0 0 60px rgba(0,0,0,.45);overflow:hidden}
.pp svg{position:absolute;inset:6%;width:88%;height:88%;fill:none;stroke:rgba(255,255,255,.28);stroke-width:.5;vector-effect:non-scaling-stroke}
.pp-b{position:absolute;translate:-50% -50%;min-width:44px;height:34px;padding:0 8px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(7,13,18,.72);color:var(--text);font:700 12.5px/1 var(--body);cursor:pointer;transition:transform .15s var(--ease),background .15s}
.pp-b:hover{transform:scale(1.08)}
.pp-b[aria-checked="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,193,78,.25),0 0 22px rgba(242,193,78,.5)}
/* league map */
.seg.conf{margin-top:0;display:grid;grid-auto-flow:row;grid-template-columns:repeat(5,minmax(0,1fr));width:100%}
.seg.conf .tab{justify-content:center;text-align:center}
.seg.conf .tab{padding:8px 6px;white-space:nowrap;font-size:13px}
.lgg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));grid-auto-rows:158px;gap:8px;max-height:430px;overflow-y:auto;padding:2px;scrollbar-width:thin}
.lgt{position:relative;display:grid;gap:3px;text-align:left;padding:12px 12px 11px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(19,35,45,.9),rgba(11,21,28,.9));cursor:pointer;transition:transform .15s var(--ease),border-color .15s,box-shadow .15s;grid-template-rows:auto auto auto 1fr auto;align-content:start;overflow:hidden}
.lgt:hover{transform:translateY(-2px);border-color:var(--line2)}
.lgt.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 30px -12px rgba(242,193,78,.5);background:linear-gradient(180deg,rgba(242,193,78,.14),rgba(11,21,28,.92))}
.lgt-flag{display:block;width:34px;height:23px;border-radius:4px;overflow:hidden;margin-bottom:4px;box-shadow:0 0 0 1px rgba(0,0,0,.4)}.lgt-flag img,.lgt-flag svg{width:100%;height:100%;object-fit:cover}
.lgt-c{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lgt b{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:21px;line-height:.95;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lgt-m{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--dim);grid-row:5}
.lgt em{grid-row:4;align-self:start;justify-self:start;font-style:normal;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#C9B3FF;background:rgba(181,140,255,.12);border-radius:6px;padding:2px 6px;margin-top:2px}
.stars{font-style:normal;color:var(--gold);letter-spacing:1px;font-size:12px}.stars span{color:var(--line2)}
.lgi{border-radius:14px;padding:14px 16px;background:var(--card);border:1px solid var(--line)}
.lgi-h{display:flex;align-items:center;gap:12px}.lgi-h h3{font-size:30px}
.lgi ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px;display:grid;gap:3px}
/* clubs */
.clg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:84px;gap:6px;max-height:300px;overflow-y:auto;padding:2px;scrollbar-width:thin}
.clt{display:grid;gap:6px;grid-template-rows:1fr auto auto;align-content:end;text-align:left;padding:10px 11px;border-radius:12px;border:1px solid var(--line);background:rgba(11,21,28,.85);cursor:pointer;transition:border-color .15s,background .15s}
.clt:hover{border-color:var(--line2)}
.clt.on{border-color:var(--gold);background:rgba(242,193,78,.12)}
.clt b{font-size:13.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;align-self:start}
.clt-s{height:4px;border-radius:2px;background:var(--line)}.clt-s i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold3),var(--gold))}
.clt-m{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.clt-m .r4,.clt-m .r3{color:var(--turf)}.clt-m .r2{color:var(--gold)}.clt-m .r1,.clt-m .r0{color:#FF8F8C}
#cardPrev{position:sticky;top:84px}
@media (max-width:860px){#cardPrev{position:static}.lgg{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
@media (max-width:560px){.seg.conf{display:flex;overflow-x:auto}.seg.conf .tab{flex:none;padding-inline:12px}.lgg{grid-template-columns:repeat(2,minmax(0,1fr))}.clg{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* player card: tier by rating */
.fcard{--c1:#F7DE8A;--c2:#D9A642;--c3:#9A6B1E;--tx:#2A1C02;--tx2:#4A3612;--rim:rgba(255,236,170,.9);
  position:relative;width:100%;max-width:300px;aspect-ratio:5/7;border-radius:22px;padding:22px;overflow:hidden;color:var(--tx);
  background:radial-gradient(120% 70% at 20% 0%,rgba(255,255,255,.55),transparent 55%),linear-gradient(160deg,var(--c1) 0%,var(--c2) 48%,var(--c3) 100%);
  box-shadow:inset 0 0 0 1.5px var(--rim),inset 0 0 0 7px rgba(0,0,0,.08),0 30px 60px -22px rgba(0,0,0,.8),0 0 60px -20px var(--c2);
  display:flex;flex-direction:column;justify-self:center;transform:perspective(900px) rotateY(0) rotateX(0);transition:transform .5s var(--ease)}
.fcard:hover{transform:perspective(900px) rotateY(-7deg) rotateX(4deg)}
.fcard.bronze{--c1:#E9B98C;--c2:#B97843;--c3:#6E3F1D;--tx:#2B1608;--tx2:#4C2B14;--rim:rgba(255,215,180,.8)}
.fcard.silver{--c1:#F1F5F8;--c2:#B9C5CF;--c3:#6E7E8B;--tx:#141C22;--tx2:#34434E;--rim:rgba(255,255,255,.9)}
.fcard.icon{--c1:#1C2B36;--c2:#0E161D;--c3:#05090C;--tx:var(--gold2);--tx2:#C9B37A;--rim:rgba(242,193,78,.9);
  background:radial-gradient(90% 60% at 80% 10%,rgba(242,193,78,.28),transparent 60%),radial-gradient(80% 50% at 10% 100%,rgba(108,198,255,.18),transparent 60%),linear-gradient(160deg,var(--c1),var(--c2) 55%,var(--c3))}
.fcard.icon::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 20%,rgba(242,193,78,.5),transparent 40% 70%,rgba(108,198,255,.4),transparent 90%);animation:spin 9s linear infinite;opacity:.35;mix-blend-mode:screen}
.fcard .sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);transform:translateX(-120%);pointer-events:none}
.fcard:hover .sheen,.fcard.lvlup .sheen{animation:sheen 1.4s var(--ease)}
.fcard .pitch{position:absolute;left:50%;bottom:-40%;width:122%;aspect-ratio:1;transform:translateX(-50%);border:1.5px solid color-mix(in srgb,var(--tx) 18%,transparent);border-radius:50%}
.fcard .pitch::after{content:"";position:absolute;left:-10%;right:-10%;top:50%;border-top:1.5px solid color-mix(in srgb,var(--tx) 18%,transparent)}
.fc-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.fc-ovr{font-family:var(--disp);font-weight:900;font-size:88px;line-height:.8;color:var(--tx);letter-spacing:-.02em}
.fc-pos{font-family:var(--disp);font-weight:800;font-size:27px;color:var(--tx2);margin-top:4px}
.fc-age{text-align:right;font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.14em;font-weight:600}
.fc-age b{display:block;font-family:var(--disp);font-size:42px;color:var(--tx);letter-spacing:0;line-height:1}
.fc-ids{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--tx)}
.fc-flag{width:33px;height:22px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.rflag{display:inline-block;position:relative;overflow:hidden;border-radius:3px;background:rgba(0,0,0,.15);vertical-align:middle}
.rflag img{display:block;width:100%;height:100%;object-fit:cover}
.rflag::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,0) 45%,rgba(0,0,0,.2));box-shadow:inset 0 0 0 .8px rgba(0,0,0,.35)}
.fc-nat{display:flex;align-items:center;gap:6px}
.flag-i{width:18px;height:12px;flex:none;vertical-align:-1px}
.fc-num{display:block;font-family:var(--disp);font-size:24px;color:var(--tx);letter-spacing:0;margin-top:4px}
.fc-name{margin-top:auto;position:relative;font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:clamp(30px,4vw,42px);line-height:.9;word-break:break-word;color:var(--tx)}
.fc-meta{position:relative;display:grid;gap:2px;margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--tx) 25%,transparent);font-size:13px;color:var(--tx2)}
.fc-meta span:first-child{font-weight:700;color:var(--tx)}
.fc-up{position:absolute;right:14px;top:50%;z-index:2;font-weight:700;font-size:16px;color:#04170C;background:var(--turf);border-radius:999px;padding:3px 10px;box-shadow:0 0 0 3px rgba(47,210,124,.25)}
.fcard.lvlup{animation:lvl 1.6s var(--ease)}
@media (prefers-reduced-motion:no-preference){.fc-up{animation:floatup 2.4s var(--ease) forwards}}

/* career hero */
.hero{display:grid;grid-template-columns:300px minmax(0,1fr);gap:36px;align-items:start}
.status h1{font-size:clamp(44px,6.4vw,76px);margin-top:4px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0;margin-top:20px;border-top:1px solid var(--line)}
.stat-grid>div{padding:11px 14px 11px 0;display:grid;gap:2px;min-width:0;border-bottom:1px solid var(--line)}
.stat-grid dt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.stat-grid dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.stat-grid dd small{color:var(--muted);font-weight:400}
.go{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:20px}
.summer{margin:16px 0 0;display:grid;gap:7px;font-size:14px;color:var(--muted);padding-left:0;list-style:none}
.summer li{padding-left:18px;position:relative}
.summer li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.act{margin-top:22px}

/* totals strip */
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:16px}
.totals div{border-top:2px solid var(--line2);padding-top:10px;position:relative}
.totals b{display:block;font-family:var(--disp);font-weight:900;font-size:50px;line-height:.95}
.totals span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.totals .gold{border-top-color:var(--gold)}
.totals .gold b{color:var(--gold);text-shadow:0 0 24px rgba(242,193,78,.35)}

/* decisions */
.decide{position:relative;border-radius:22px;padding:24px;background:linear-gradient(180deg,rgba(242,193,78,.07),transparent 40%),var(--glass);box-shadow:inset 0 0 0 1px rgba(242,193,78,.45),0 30px 70px -40px rgba(0,0,0,.9)}
.d-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pips{display:flex;gap:5px}
.pips i{width:24px;height:4px;border-radius:3px;background:var(--line2)}
.pips i.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.pips i.done{background:rgba(242,193,78,.4)}
.decide h2{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:44px;line-height:.95;letter-spacing:.005em}
.decide>p,#lvDec>p{color:var(--muted);max-width:70ch;margin:10px 0 18px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:10px}
.opt{position:relative;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent),var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:15px 15px 15px 17px;cursor:pointer;display:grid;gap:6px;align-content:start;overflow:hidden;transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.opt::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--line2);transition:background .2s,top .2s,bottom .2s}
.opt:hover{transform:translateY(-2px);border-color:rgba(242,193,78,.7);box-shadow:0 14px 30px -18px rgba(242,193,78,.6)}
.opt:hover::before{background:var(--gold);top:0;bottom:0}
.o-l{font-weight:700;font-size:16.5px}
.o-s{font-size:13px;color:var(--gold2)}
.o-d{font-size:13px;color:var(--muted)}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.bdg{font-size:10.5px;font-weight:700;letter-spacing:.06em;border-radius:5px;padding:1px 6px;background:var(--line);color:var(--text)}
.bdg.ucl{background:var(--sky);color:#04192b}
.bdg.warn{background:rgba(255,94,91,.16);color:var(--red)}
.decide.egg{box-shadow:inset 0 0 0 1px rgba(255,227,161,.8),0 0 0 4px rgba(242,193,78,.08),0 30px 70px -30px rgba(242,193,78,.45);background:radial-gradient(80% 60% at 100% 0%,rgba(255,227,161,.16),transparent 60%),var(--glass)}

/* sections & panels */
.sec-h{display:flex;align-items:baseline;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:36px;line-height:1}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.cabinet{display:flex;flex-wrap:wrap;gap:8px}
.tro{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(242,193,78,.5);background:linear-gradient(180deg,rgba(242,193,78,.14),rgba(242,193,78,.04));color:var(--gold2);border-radius:999px;padding:5px 13px;font-size:13.5px;font-weight:600}
.tro::before{content:"";width:9px;height:11px;background:var(--gold);clip-path:polygon(0 0,100% 0,85% 45%,60% 60%,60% 80%,85% 100%,15% 100%,40% 80%,40% 60%,15% 45%)}
.tro b{font-family:var(--mono);color:var(--gold)}
.aw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:999px;padding:5px 13px;font-size:13.5px;background:rgba(108,198,255,.05)}
.aw b{font-family:var(--mono);color:var(--sky)}
svg text{fill:var(--muted);font:11px var(--mono)}
.note{border:1px solid rgba(47,210,124,.5);background:rgba(47,210,124,.07);border-radius:12px;padding:10px 14px;margin:0;color:var(--text)}

/* season feed */
.feed{display:grid;gap:16px}
.season{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px}
.season.latest{border-color:var(--line2);box-shadow:0 0 0 1px rgba(242,193,78,.18),0 24px 60px -40px rgba(242,193,78,.4)}
.s-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.s-year{font-family:var(--disp);font-weight:900;font-size:44px;color:var(--gold);line-height:.9}
.s-club b{display:block;font-size:17px}
.s-club span{color:var(--muted);font-size:13px}
.s-ovr{font-family:var(--disp);font-weight:900;font-size:44px;line-height:.9;text-align:right}
.s-ovr small{display:block;font-family:var(--mono);font-size:12px;font-weight:700}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 6px;background:var(--line2);color:var(--text);vertical-align:2px;margin-left:6px}
.kpis{display:flex;flex-wrap:wrap;gap:8px 26px}
.kpi{display:grid}
.kpi b{font-family:var(--mono);font-size:21px;font-weight:700}
.kpi span{font-size:10.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line2);border-radius:9px;padding:4px 10px;color:var(--muted)}
.chip b{color:var(--text);font-weight:600}
.chip.win{border-color:rgba(242,193,78,.6);color:var(--gold2);background:rgba(242,193,78,.06)}
.chip.win b{color:var(--gold)}
.lines{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:14px;color:var(--muted)}
.lines li b{color:var(--text);font-weight:600}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600}
summary:hover{color:var(--text)}
.rec{display:inline-flex;border:1px dashed rgba(242,193,78,.7);color:var(--gold2);border-radius:9px;padding:5px 10px;font-size:13px;font-weight:600}

/* newspaper */
.paper{background:linear-gradient(180deg,#F3EDDF,var(--paper));color:var(--paper-ink);border-radius:6px;padding:10px 14px 12px;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 12px 30px -18px rgba(0,0,0,.9);font-family:var(--news);position:relative}
.paper::after{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 2px,transparent 2px 4px)}
.pp-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:3px double var(--paper-ink);padding-bottom:5px;margin-bottom:7px}
.pp-top b{font-family:var(--news);font-weight:700;font-size:17px;letter-spacing:.02em}
.pp-top span{font-size:11px;color:var(--paper-dim);font-style:italic}
.paper h3{font-family:var(--news);font-weight:700;font-size:22px;line-height:1.05;letter-spacing:-.005em}
.paper p{margin:5px 0 0;font-size:13px;color:var(--paper-dim);font-family:var(--body)}
.paper.gold h3{color:#7A4F00}
.paper.bad h3{color:#8E1B12}
.paper.big{padding:16px 20px 18px;transform:rotate(-.6deg)}
.paper.big .pp-top b{font-size:clamp(22px,4vw,30px)}
.paper.big h3{font-size:clamp(34px,6.5vw,58px);line-height:.98;margin-top:4px}
.paper.big p{font-size:15px}
.morning{display:grid;gap:10px}
@media (prefers-reduced-motion:no-preference){.paper.big{animation:paperIn .7s var(--ease)}}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
.t th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line2)}
.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.t tbody tr:hover td{background:rgba(255,255,255,.025)}
.t th:nth-child(2),.t td:nth-child(2){text-align:left;font-family:var(--body)}
.t th:first-child,.t td:first-child{text-align:left;width:34px;color:var(--dim)}
.t tr.me td{background:rgba(242,193,78,.1);color:var(--gold2)}
.t tr.me td:nth-child(2){font-weight:700}
.t tr.zone td:first-child{box-shadow:inset 3px 0 0 var(--sky)}
.t tr.drop td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.t.small td,.t.small th{padding:5px 8px}
.t tr.grp td{background:transparent;color:var(--gold);font:600 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;text-align:left;padding:16px 8px 6px;border-bottom:1px solid var(--line2)}
.champ-b{font:700 9.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--gold);border-radius:5px;padding:3px 6px;margin-left:6px;vertical-align:2px}
.t tr.z-ucl td:first-child{box-shadow:inset 3px 0 0 var(--sky)}
.t tr.z-uel td:first-child{box-shadow:inset 3px 0 0 #F59E3B}
.t tr.z-uecl td:first-child{box-shadow:inset 3px 0 0 #2FD2C0}
.t tr.z-up td:first-child{box-shadow:inset 3px 0 0 var(--turf)}
.t tr.z-po td:first-child{box-shadow:inset 3px 0 0 #B58CFF}
.t tr.z-drop td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.t tr.z-drop td{color:var(--muted)}
.zleg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0;font-size:12px;color:var(--muted)}
.zleg span{display:inline-flex;align-items:center;gap:6px}.zleg i{width:10px;height:10px;border-radius:3px;background:var(--line2)}
.zleg .z-champ i{background:var(--gold)}.zleg .z-ucl i{background:var(--sky)}.zleg .z-uel i{background:#F59E3B}.zleg .z-uecl i{background:#2FD2C0}.zleg .z-up i{background:var(--turf)}.zleg .z-po i{background:#B58CFF}.zleg .z-drop i{background:var(--red)}
.lg-head{display:flex;align-items:center;gap:14px;margin:0 0 10px}.lg-head h2{font-size:clamp(34px,6vw,54px)}
.lg-flag{display:inline-flex;width:54px;height:36px;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line2),0 6px 18px rgba(0,0,0,.35);flex:none}.lg-flag img,.lg-flag svg{width:100%;height:100%;object-fit:cover}
.reg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;font-size:12.5px}.reg b{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);align-self:center;margin-right:4px}
.reg span{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.bks{display:grid;gap:18px;margin-top:22px}
.bk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 16px}
.bk-cols{display:flex;gap:14px;overflow-x:auto;padding-top:8px;scrollbar-width:thin}
.bk-col{display:flex;flex-direction:column;gap:8px;min-width:190px;flex:1}
.bk-ms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bk-st{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.bk-m{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.bk-m>i{position:absolute;right:30px;bottom:6px;font-style:normal;font-size:11px}
.bk-t{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;font-size:13px;color:var(--muted)}
.bk-t+.bk-t{border-top:1px solid var(--line)}
.bk-t.win{color:var(--text);font-weight:600}.bk-t.win b{color:var(--gold)}
.bk-t.me{background:rgba(242,193,78,.1)}
.bk-col:last-child .bk-m{border-color:rgba(242,193,78,.45);box-shadow:0 0 24px rgba(242,193,78,.12)}

.bar{display:inline-block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--gold3),var(--gold));vertical-align:middle}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:18px}
.selrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.selrow select{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;max-width:100%}

/* hall of fame */
.hof{position:relative;border-radius:26px;padding:30px;background:radial-gradient(70% 50% at 50% -10%,rgba(242,193,78,.22),transparent 70%),radial-gradient(40% 30% at 0% 0%,rgba(214,236,255,.08),transparent 70%),var(--glass);box-shadow:inset 0 0 0 1px rgba(242,193,78,.55),0 40px 90px -50px rgba(242,193,78,.5);display:grid;gap:28px}
.hof h1{font-size:clamp(50px,9vw,110px)}
.tier{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:30px;margin:4px 0 0;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
.legend-row{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:14px}
.legend-row .trk{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.legend-row .trk i{display:block;height:100%;background:var(--line2);border-radius:5px}
.legend-row.me .trk i{background:linear-gradient(90deg,var(--gold3),var(--gold))}
.legend-row.me{color:var(--gold2);font-weight:700}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}

/* filmstrip */
.film{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,190px);gap:0;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 0;background:
  radial-gradient(circle,var(--bg) 4px,transparent 4.5px) 0 4px/24px 14px repeat-x,
  radial-gradient(circle,var(--bg) 4px,transparent 4.5px) 0 calc(100% - 4px)/24px 14px repeat-x,#03070A;border-radius:10px;scrollbar-width:thin}
.frame{scroll-snap-align:start;display:grid;gap:4px;align-content:start;padding:12px 14px;margin:0 4px;border-radius:6px;background:linear-gradient(180deg,#14232D,#0B151C);border:1px solid var(--line);min-height:140px}
.frame .f-y{font-family:var(--disp);font-weight:900;font-size:24px;color:var(--muted);line-height:1}
.frame b{font-size:13.5px}
.frame .f-m{font-size:13px;color:var(--muted)}
.frame .f-o{margin-top:auto;font-size:20px;font-weight:700}
.frame .f-o small{font-size:11px;color:var(--dim);margin-left:6px;font-weight:500}
.frame.gold{border-color:rgba(242,193,78,.6);background:linear-gradient(180deg,rgba(242,193,78,.18),#0B151C 70%)}
.frame.gold .f-y,.frame.gold .f-m{color:var(--gold2)}
.frame.rec .f-m{color:var(--gold2)}
.frame.aw .f-m{color:var(--sky)}

/* attributes, relations, records */
.attrs{display:grid;gap:9px}
.at-row{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:14px}
.at-row .trk,.rec-row .trk{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.at-row .trk i{display:block;height:100%;background:var(--line2);border-radius:4px}
.at-row.key .trk i{background:linear-gradient(90deg,var(--gold3),var(--gold));box-shadow:0 0 12px rgba(242,193,78,.4)}
.at-row b{text-align:right}
.posfit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px}
.posfit>span:first-child{margin-right:4px}
.pf{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line2);border-radius:8px;padding:3px 9px;font-size:13px}
.pf i{font-style:normal;color:var(--muted)}
.pf.cur{border-color:var(--gold);color:var(--gold2)}
.pf.better{border-color:var(--turf)}.pf.better i{color:var(--turf)}
.recs{display:grid;gap:10px}
.rec-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 44px;gap:12px;align-items:center;font-size:14px}
.rec-row div{display:grid;min-width:0}
.rec-row div span{color:var(--muted);font-size:12.5px}
.rec-row .trk i{display:block;height:100%;background:var(--sky);border-radius:4px}
.rec-row.mine b{color:var(--gold2)}
.rec-row.mine .trk i{background:var(--gold)}
.rec-row .num{text-align:right}
.perks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:8px}
.perk{border:1px dashed var(--line2);border-radius:12px;padding:11px 13px;display:grid;gap:3px;color:var(--dim)}
.perk b{font-size:14px;color:var(--muted)}
.perk span{font-size:12.5px}
.perk.on{border:1px solid rgba(242,193,78,.5);background:linear-gradient(180deg,rgba(242,193,78,.09),transparent);color:var(--muted)}
.perk.on b{color:var(--gold2)}
.perk em{font-style:normal;font-size:13px;color:var(--gold);font-weight:600}
.perk em.neg{color:var(--red)}

/* nemesis */
.nem{display:grid;gap:14px 36px;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:start}
.nem>.nem-h{flex-direction:column;align-items:flex-start}
.nem>.nem-h .nem-score{justify-items:start;text-align:left;margin-top:8px}
.nem>p{grid-column:1/-1}
@media (max-width:820px){.nem{grid-template-columns:1fr}}
.nem-panel{background:linear-gradient(100deg,rgba(242,193,78,.06),transparent 40%,transparent 60%,rgba(255,94,91,.08)),var(--glass)}
.nem-h{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end}
.nem-h h2{font-size:clamp(36px,5vw,52px);color:#FFB1AE;margin-top:2px}
.nem-score{display:grid;justify-items:end;text-align:right}
.nem-score span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nem-score b{font-family:var(--disp);font-weight:900;font-size:56px;line-height:.95}
.nem-score b i{font-style:normal;color:var(--dim);margin:0 4px}
.vs-t{display:grid;gap:0}
.vs-r{display:grid;grid-template-columns:1fr minmax(120px,auto) 1fr;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.vs-r span{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.vs-r b{font-size:18px}
.vs-r b:last-child{text-align:right}
.vs-r b.win:first-child{color:var(--gold)}
.vs-r b.win:last-child{color:#FFB1AE}
.vs-r.head b{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:22px;color:var(--text)}
.nem-v{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:28px;margin:4px 0 0}

/* life: money & social */
.life-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:18px}
.money,.social{border-radius:22px;padding:24px;display:grid;align-content:start;gap:6px}
.money{background:radial-gradient(90% 70% at 100% 0%,rgba(242,193,78,.2),transparent 60%),var(--glass);box-shadow:inset 0 0 0 1px rgba(242,193,78,.4)}
.social{background:radial-gradient(90% 70% at 100% 0%,rgba(108,198,255,.18),transparent 60%),var(--glass);box-shadow:inset 0 0 0 1px rgba(108,198,255,.35)}
.big{font-size:clamp(54px,8vw,84px);line-height:.9}
.money .big{color:var(--gold)}
.social .big{color:var(--sky)}
.ledger{display:grid;gap:0;margin:12px 0 0}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.ledger dt{color:var(--muted)}.ledger dd{margin:0}
.fol-bars{display:flex;align-items:flex-end;gap:4px;height:80px}
.fol-bars span{flex:1;min-width:4px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--sky),rgba(108,198,255,.25))}
.shop{display:grid;gap:8px}
.shop-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.shop-i>div:first-child{display:grid;gap:2px;min-width:0}
.shop-i span{font-size:13px;color:var(--muted)}
.shop-i em{font-style:normal;color:var(--red)}
.shop-i.on{border-color:rgba(47,210,124,.45);background:linear-gradient(90deg,rgba(47,210,124,.08),transparent 60%),var(--bg2)}
.shop-b{display:flex;gap:10px;align-items:center}
.shop-b .num{font-size:14px;color:var(--gold2);white-space:nowrap}
.shop-b small{color:var(--dim);font-family:var(--body)}
.inv-v{font-size:13px}

/* jury */
.jury{display:grid;gap:6px;text-align:left;width:100%;max-width:640px;margin:6px auto 0}
.jury-h,.jury-r{display:grid;grid-template-columns:minmax(90px,130px) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;font-size:13.5px}
.jury-h b{font-size:12.5px;color:var(--muted);font-weight:600;overflow-wrap:anywhere}
.jury-r>div{display:flex;align-items:center;gap:6px;min-width:0}
.jb{display:block;height:8px;border-radius:4px;flex:0 1 auto}
.jb.me{background:var(--gold)}.jb.them{background:var(--sky)}
.jury-r em{font-style:normal;font-size:12px;color:var(--muted)}
/* ceremony */
.kopa{display:grid;gap:8px;justify-items:center;width:100%}
.cer{position:relative;border-radius:26px;padding:30px;background:radial-gradient(70% 60% at 50% -10%,rgba(242,193,78,.3),transparent 65%),var(--glass);box-shadow:inset 0 0 0 1px rgba(242,193,78,.6);display:grid;gap:14px;text-align:center;overflow:hidden}
.cer-win span{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.cer-win h1{font-size:clamp(50px,10vw,110px);background:linear-gradient(180deg,#FFF3CF,var(--gold) 65%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
.cer-win p{margin:4px 0 0;color:var(--muted)}
.cer-you{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:30px;margin:0}
.cer-list{list-style:none;margin:0 auto;padding:0;display:grid;gap:4px;width:100%;max-width:560px;text-align:left}
.cer-list li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 11px;border-radius:9px;background:var(--bg2)}
.cer-list li b{font-weight:600}
.cer-list li em{font-style:normal;color:var(--muted);font-size:13px}
.cer-list li.me{background:rgba(242,193,78,.16);outline:1px solid var(--gold)}
.cer-list li.mate{outline:1px solid var(--sky)}
.cer-list li.nem{outline:1px solid rgba(255,94,91,.7)}
.cer-list li:nth-child(-n+3) .num{color:var(--gold)}
.cer .go{justify-content:center}
@media (prefers-reduced-motion:no-preference){.cer-list li{animation:rise .4s ease-out both;animation-delay:calc(var(--i)*35ms)}}
/* head to head */
.h2h-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px}
.h2h{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:14px}
.h2h-top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:6px}
.h2h-top b{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:22px;overflow-wrap:anywhere}
.h2h-top b:last-child{text-align:right}
.h2h-top .num{font-family:var(--disp);font-weight:900;font-size:34px;color:var(--gold)}
.h2h-r{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
.h2h-r em{font-style:normal;color:var(--muted);text-align:center}
.h2h-r span:last-child{text-align:right}
.h2h-r .win{color:var(--gold);font-weight:700}
/* multiplayer */
.roster{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.roster li{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.roster li.me{border-color:var(--gold)}
.roster li div{display:grid;min-width:0}
.roster li span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.roster li .num{font-family:var(--disp);font-weight:900;font-size:28px;color:var(--gold)}
.rdy{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-radius:6px;padding:3px 8px;background:var(--line);white-space:nowrap}
.rdy.on{background:var(--turf);color:#04170c}
.roster.slots li{flex-wrap:wrap}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,7,10,.86);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.modal-in{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:16px;max-width:460px;width:100%;max-height:100%;overflow:auto;display:grid;gap:10px}
.modal-in img{width:100%;border-radius:10px;display:block}
.news-in{max-width:560px;gap:14px;padding:26px;background:radial-gradient(80% 50% at 50% -10%,rgba(242,193,78,.22),transparent 70%),var(--card);box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(242,193,78,.35)}
.news-in h2{font-size:clamp(44px,8vw,64px)}.news-in h2 em{font-style:italic;color:var(--gold)}
.news-l{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.news-l li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.news-l b{display:block;font-size:15px}.news-l span{font-size:13.5px;color:var(--muted)}
.news-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(242,193,78,.12);color:var(--gold)}
.news-ic .ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.news-in{animation:fanIn .6s var(--ease) both}}

.err{color:var(--red);border:1px solid var(--red);border-radius:12px;padding:10px 14px;margin:16px 0 0;background:rgba(255,94,91,.06)}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:100}

/* big match: broadcast scoreboard */
.board{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:0;align-items:stretch;border-radius:16px;margin:6px 0 18px;overflow:hidden;background:#04080B;box-shadow:inset 0 0 0 1px var(--line2),0 20px 40px -24px rgba(0,0,0,.9)}
.board .tm{display:grid;gap:4px;min-width:0;padding:16px 18px;background:linear-gradient(90deg,rgba(242,193,78,.16),transparent 80%)}
.board .tm.r{text-align:right;background:linear-gradient(270deg,rgba(255,94,91,.14),transparent 80%)}
.board .tm b{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:clamp(22px,4vw,42px);line-height:.92;overflow-wrap:anywhere}
.board .tm span{font-family:var(--mono);color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.board .vs{display:grid;place-items:center;align-content:center;gap:2px;min-width:118px;padding:10px 16px;background:linear-gradient(180deg,#0E1A22,#05090C);border-inline:1px solid var(--line2)}
.board .vs b{font-family:var(--disp);font-weight:900;font-size:52px;line-height:.9;color:var(--gold);text-shadow:0 0 22px rgba(242,193,78,.5);letter-spacing:.02em}
.board .vs .vsx{font-size:34px;color:var(--muted);text-shadow:none}
.clock{font-size:13px;color:var(--text);background:rgba(255,255,255,.07);border-radius:6px;padding:1px 8px}
.onair{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--red);border-radius:4px;padding:1px 6px;display:inline-flex;align-items:center;gap:5px}
.onair::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
@media (prefers-reduced-motion:no-preference){.onair::before{animation:blink 1s steps(2) infinite}}
.goalfx{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(48px,11vw,110px);color:var(--gold);text-shadow:0 0 40px rgba(242,193,78,.8);pointer-events:none;opacity:0;background:radial-gradient(60% 90% at 50% 50%,rgba(242,193,78,.25),transparent 70%)}
.goalfx.op{color:#FF8F8C;text-shadow:0 0 40px rgba(255,94,91,.7);background:radial-gradient(60% 90% at 50% 50%,rgba(255,94,91,.2),transparent 70%)}
.goalfx.on{animation:goal 1.4s var(--ease) forwards}
.feedl{list-style:none;margin:0;padding:0 4px 0 0;display:grid;gap:4px;max-height:340px;overflow-y:auto;scroll-behavior:smooth}
.feedl li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 10px;border-radius:10px;font-size:14.5px;color:var(--muted)}
.feedl li.pend{display:none}
.feedl .mn{font-size:12px;color:var(--dim);text-align:right}
.feedl li.whistle{color:var(--dim);font-style:italic}
.feedl li.gl{color:var(--text);background:rgba(242,193,78,.08);box-shadow:inset 3px 0 0 var(--gold);font-weight:600}
.feedl li.gl.me{background:linear-gradient(90deg,rgba(242,193,78,.25),rgba(242,193,78,.05));color:var(--gold2);font-weight:700}
.feedl li.gl.op{background:rgba(255,94,91,.09);box-shadow:inset 3px 0 0 var(--red);color:#FFC9C7}
.feedl li.save{color:var(--turf);font-weight:600}
.feedl li.miss{color:#FFC9C7}
.feedl li.card .tx::before{content:"";display:inline-block;width:9px;height:12px;border-radius:2px;background:#F5D90A;margin-right:7px;vertical-align:-1px}
@media (prefers-reduced-motion:no-preference){.feedl li:not(.pend){animation:slidein .35s var(--ease)}}
#lvDec{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
#lvDec h2{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:40px;line-height:1}
.keys{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:4px;font-size:14px}
.keys li{padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.03);color:var(--text)}
.bigm.won{box-shadow:inset 0 0 0 1px rgba(47,210,124,.6),0 30px 70px -40px rgba(47,210,124,.5)}

/* motion: sections slide in on a tab change, options of a new decision follow each other */
@media (prefers-reduced-motion:no-preference){
  main.enter>*{animation:pageIn .45s var(--ease) both}
  main.enter>*:nth-child(2){animation-delay:.05s}
  main.enter>*:nth-child(n+3){animation-delay:.1s}
  .opts>.opt{animation:optIn .4s var(--ease) both}
  .opts>.opt:nth-child(2){animation-delay:.05s}.opts>.opt:nth-child(3){animation-delay:.1s}.opts>.opt:nth-child(n+4){animation-delay:.15s}
}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}}
@keyframes optIn{from{opacity:0;transform:translateY(10px)}}
.opt:active{transform:scale(.985)}
/* touch screens: no sticky hover lifts */
