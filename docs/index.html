function render(){
  const app=document.getElementById('app');
  let body;
  if(UI.tab==='home')body=viewHome();
  else if(UI.tab==='multi')body=viewMulti();
  else if(UI.tab==='saves')body=viewSaves();
  else if(!G||(!G.P&&!G.C))body=viewSetup();
  else if(UI.tab==='tables')body=viewTables();
  else if(UI.tab==='world')body=viewWorld();
  else if(UI.tab==='life'&&G.P&&!isCoach())body=viewLife();
  else if(UI.tab==='museum'&&G.P&&!isCoach())body=viewMuseum();
  else body=viewCareer();
  const enter=UI.shown!==UI.tab;UI.shown=UI.tab;
  app.innerHTML=topbar()+`<main class="wrap${enter?' enter':''}">${UI.saveErr?`<p class="err" role="alert">${EN?`Browser storage is full — progress isn't being saved. Delete old careers in the “Saves” tab.`:`Память браузера переполнена — прогресс не сохраняется. Удалите старые карьеры во вкладке «Сохранения».`}</p>`:''}${body}${siteFoot()}</main>${consentBanner()}`+(G&&(G.P||G.C)?shareModal():'');
  try{afterRender()}catch(e){console.error(e)}
}


/* ================= ads & cookies =================
   Ads run only on the own domain and only after the visitor agreed to advertising cookies (consent first, 152-ФЗ).
   Yandex Advertising Network (РСЯ): a fullscreen block after a career and every few seasons, a rewarded block for an in-game bonus.
   Block ids come from partner.yandex.ru; with empty ids nothing is loaded at all. */
const ADS_CFG={full:'',fullDesk:'',rew:''};
const CONSENT_KEY='legenda-polya-consent';
const adsHost=()=>{try{return /(^|\.)legendapolya\.com$/.test(location.host)||localStorage.getItem('legenda-polya-adtest')==='1'}catch(e){return false}};
const adsOn=()=>adsHost()&&!!(ADS_CFG.full||ADS_CFG.fullDesk||ADS_CFG.rew||(()=>{try{return localStorage.getItem('legenda-polya-adtest')==='1'}catch(e){return false}})());
const consentGet=()=>{try{return localStorage.getItem(CONSENT_KEY)}catch(e){return null}};
function consentSet(v){try{localStorage.setItem(CONSENT_KEY,v)}catch(e){}UI.cookies=false;if(v==='all')adsLoad();render()}
const ADS={loaded:false,lastFull:0};
const isTouch=()=>{try{return matchMedia('(pointer:coarse)').matches}catch(e){return false}};
function adsLoad(){
  if(ADS.loaded||!adsOn()||consentGet()!=='all'||typeof document==='undefined'||!document.head)return;
  ADS.loaded=true;window.yaContextCb=window.yaContextCb||[];
  const sc=document.createElement('script');sc.src='https://yandex.ru/ads/system/context.js';sc.async=true;document.head.appendChild(sc);
}
function adsFull(force){
  if(!ADS.loaded)return;const t=isTouch(),id=t?ADS_CFG.full:(ADS_CFG.fullDesk||ADS_CFG.full);if(!id)return;
  if(!force&&Date.now()-ADS.lastFull<240000)return;ADS.lastFull=Date.now();
  window.yaContextCb.push(()=>{try{window.Ya.Context.AdvManager.render({blockId:id,type:'fullscreen',platform:t?'touch':'desktop'})}catch(e){}});
}
const adsRewOk=()=>ADS.loaded&&!!ADS_CFG.rew&&isTouch();
function adsRewarded(onReward){
  if(!adsRewOk())return;
  window.yaContextCb.push(()=>{try{window.Ya.Context.AdvManager.render({blockId:ADS_CFG.rew,type:'rewarded',platform:'touch',onRewarded:ok=>{if(ok)onReward()}})}catch(e){}});
}
const adBonus=()=>Math.max(.2,annual()*.05);
function consentBanner(){
  if(!adsOn()||(consentGet()&&!UI.cookies))return '';
  return `<div class="cookie" role="dialog" aria-live="polite" aria-label="Cookie"><p><b>${EN?`Cookies and ads.`:`Cookie и реклама.`}</b> ${EN?`Your game saves are stored only in your browser. If you allow it, the site will show ads from the Yandex Advertising Network, which uses cookies and anonymised device data. Without your consent no ads are loaded. Details in the`:`Сохранения игры хранятся только в вашем браузере. Если разрешите, на сайте будет показываться реклама Рекламной сети Яндекса: она использует cookie и обезличенные данные устройства. Без согласия реклама не загружается. Подробнее — в`} <a href="privacy.html" target="_blank" rel="noopener">${EN?`privacy policy`:`политике конфиденциальности`}</a>.</p><div class="go" style="margin:10px 0 0"><button class="btn primary" data-a="consentAll">${EN?`Allow`:`Разрешить`}</button><button class="btn ghost" data-a="consentMin">${EN?`Necessary only`:`Только необходимые`}</button></div></div>`;
}
function siteFoot(){
  return `<footer class="foot"><span class="age-mark" title="${EN?`Age rating`:`Возрастная категория`}">12+</span><a class="small" href="privacy.html" target="_blank" rel="noopener">${EN?`Privacy policy`:`Политика конфиденциальности`}</a>${adsOn()?(EN?"<button class=\"btn ghost mini\" data-a=\"consentReset\">Cookie settings</button>":'<button class="btn ghost mini" data-a="consentReset">Настройки cookie</button>'):''}<button class="btn ghost mini" data-a="lang" lang="${EN?'ru':'en'}">${LANG_OTHER}</button></footer>`;
}
/* ================= events ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  if(a!=='snd'&&b.matches('button'))sfx('click');
  if(a==='tab'){UI.tab=b.dataset.v;render();window.scrollTo(0,0)}
  else if(a==='home'){UI.tab='home';render();window.scrollTo(0,0)}
  else if(a==='farewell'){if(!RUN&&G&&G.P&&!G.P.farewell){RUN=farewellGen();stepSeason()}}
  else if(a==='lang'){setLang(EN?'ru':'en')}
  else if(a==='consentAll'){consentSet('all')}
  else if(a==='consentMin'){consentSet('min')}
  else if(a==='consentReset'){if(consentGet()==='all'&&ADS.loaded){consentSet('min');location.reload()}else{UI.cookies=true;render()}}
  else if(a==='adRew'){if(!RUN&&G&&G.P&&G.adRewY!==G.year)adsRewarded(()=>{const b=adBonus();G.P.earn+=b*1e6;G.adRewY=G.year;UI.shopMsg=`${EN?`Ad integration: +${fmtM(b)}.`:`Рекламная интеграция: +${fmtM(b)}.`}`;save();render()})}
  else if(a==='snd'){SND.on=!SND.on;try{localStorage.setItem('legenda-polya-snd',SND.on?'1':'0')}catch(err){}render();if(SND.on)sfx('coin')}
  else if(a==='lvSkip'){if(UI.live)UI.live.n=1e9;liveTick()}
  else if(a==='paperOk'){G.paperSeen=G.seasons[0].label;save();render()}
  else if(a==='shop'){shopAct(b.dataset.k,b.dataset.id)}
  else if(a==='play'){sfx('whistle');if(inRoom())mpSeasonGo();else beginSeason()}
  else if(a==='mpSkip'){if(UI.wait)UI.wait.skip=true;else if(MATCH)MATCH.skip=true}
  else if(a==='h2hGo'){if(MATCH&&MATCH.kind==='h2h')mpH2HGo(MATCH)}
  else if(a==='mopt'){stepSeason(+b.dataset.i)}
  else if(a==='opt'){chooseOpt(+b.dataset.i)}
  else if(a==='new'){UI.confirmNew=true;render()}
  else if(a==='newNo'){UI.confirmNew=false;render()}
  else if(a==='newYes'){UI.confirmNew=false;dropEmpty();G=null;RUN=null;MATCH=null;UI.wait=null;UI.tab='career';try{localStorage.removeItem(ACTIVE_KEY)}catch(err){}render();window.scrollTo(0,0)}
  else if(a==='slotLoad'){if(loadSlot(b.dataset.id)){UI.tab='career';render();window.scrollTo(0,0)}}
  else if(a==='slotDel'){UI.delSlot=b.dataset.id;render()}
  else if(a==='slotDelYes'){deleteSlot(UI.delSlot);UI.delSlot=null;render()}
  else if(a==='slotDelNo'){UI.delSlot=null;render()}
  else if(a==='ret'){UI.confirmRetire=true;render()}
  else if(a==='retNo'){UI.confirmRetire=false;render()}
  else if(a==='cer'){G.ceremony=false;save();render();window.scrollTo(0,0)}
  else if(a==='share'){openShare()}
  else if(a==='shareClose'){UI.share=null;render()}
  else if(a==='shareNative'){const f=new File([UI.share.blob],'legenda.png',{type:'image/png'});navigator.share({files:[f],title:EN?'Legend of the Pitch':(EN?"Legend of the Pitch":'Легенда поля')}).catch(()=>{})}
  else if(a==='mpCreate'){mpCreate()}
  else if(a==='mpInvite'){mpInvite(b)}
  else if(a==='mpSwitchNo'){UI.mpSwitch=false;render()}
  else if(a==='mpSwitchGo'){UI.mpSwitch=false;const code=UI.mpCode;MP.sess=null;MP.room=null;mpSave();UI.mpCode=code;mpJoin()}
  else if(a==='mpQr'){UI.mpQr=!UI.mpQr;render()}
  else if(a==='mpEmo'){mpSay(b.dataset.v)}
  else if(a==='mpJoinCode'){UI.mpCode=b.dataset.v;mpJoin()}
  else if(a==='mpJoin'){mpJoin()}
  else if(a==='mpReady'){mpReady()}
  else if(a==='mpStart'){mpStartNow()}
  else if(a==='mpLeave'){mpLeave()}
  else if(a==='mpBegin'){mpBegin()}
  else if(a==='mpCopy'){const t=MP.sess?MP.sess.code:'';try{navigator.clipboard.writeText(t).then(()=>{b.textContent=(EN?"Copied":'Скопировано')},()=>{b.textContent=t})}catch(err){b.textContent=t}}
  else if(a==='setMode'){UI.form.mode=b.dataset.v;render()}
  else if(a==='cPlay'){beginCoachHalf()}
  else if(a==='cSell'){sellPlayer(b.dataset.id);render()}
  else if(a==='cDrop'&&isCoach()){if(G.C.squad.length>18){const p=G.C.squad.find(x=>x.id===b.dataset.id);G.C.squad=G.C.squad.filter(x=>x!==p);UI.cMsg=p?`${EN?`${p.name} is no longer called up.`:`${p.name} больше не вызывается.`}`:null;save()}else UI.cMsg=(EN?"You can't leave fewer than 18 players.":'Меньше 18 игроков оставлять нельзя.');render()}
  else if(a==='cBuy'){buyPlayer(b.dataset.id,b.dataset.m);render()}
  else if(a==='cRetYes'){UI.confirmRetire=false;coachRetire('choice');render();window.scrollTo(0,0)}
  else if(a==='toCoach'){startCoach(true)}
  else if(a==='retYes'){UI.confirmRetire=false;doRetire('choice');render();window.scrollTo(0,0)}
});
document.addEventListener('input',e=>{
  const id=e.target.id,f=UI.form;
  if(id==='f-name'){f.name=e.target.value;updPrev()}
  else if(id==='f-num'){f.num=e.target.value;updPrev()}
  else if(id==='m-name'||id==='m-name2'){f.name=e.target.value;mpPushSetupSoon()}
  else if(id==='m-num'){f.num=e.target.value;mpPushSetupSoon()}
  else if(id==='m-code'){UI.mpCode=e.target.value.toUpperCase()}
  else if(id==='m-pub'){UI.mpPublic=e.target.checked}
});
document.addEventListener('change',e=>{
  const id=e.target.id,f=UI.form;
  if(id==='f-nat'){f.nat=e.target.value;render()}
  else if(id==='f-pos'){f.pos=e.target.value;f.num=NUM_BY_POS[f.pos];const n=document.getElementById('f-num');if(n)n.value=f.num;updPrev()}
  else if(id==='f-lg'){f.lg=e.target.value;f.club=S_LEAGUES.find(l=>l.id===f.lg).clubs[0].name;render()}
  else if(id==='f-club'){f.club=e.target.value;updPrev()}
  else if(id==='f-rus'){f.rus=e.target.value}
  else if(id==='f-nat2'){f.nat2=e.target.value}
  else if(id==='f-cage'){f.cage=+e.target.value}
  else if(id==='cScheme'&&isCoach()){G.C.tactic.scheme=e.target.value;save();render()}
  else if(id==='cStyle'&&isCoach()){G.C.tactic.style=e.target.value;save();render()}
  else if(id==='tblLg'){UI.tblLg=e.target.value;render()}
  else if(id==='focus'&&G&&G.P){G.P.focus=e.target.value;save()}
  else if(id==='m-nat'){f.nat=e.target.value;if(f.nat2===f.nat)f.nat2='';mpPushSetupSoon();render()}
  else if(id==='m-nat2'){f.nat2=e.target.value;mpPushSetupSoon()}
  else if(id==='m-pos'){f.pos=e.target.value;f.num=NUM_BY_POS[f.pos];mpPushSetupSoon();render()}
  else if(id==='m-lg'){f.lg=e.target.value;f.club=S_LEAGUES.find(l=>l.id===f.lg).clubs[0].name;mpPushSetupSoon();render()}
  else if(id==='m-club'){f.club=e.target.value;mpPushSetupSoon()}
  else if(id==='m-rus'){if(MP.sess&&MP.room&&MP.room.host===MP.sess.pid)mpHostRus(e.target.value);else f.rus=e.target.value}
});
document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();const i=document.getElementById('m-chat');if(i){mpSay(i.value);i.value=''}return}if(e.target.id==='setupForm'){e.preventDefault();startCareer()}else if(e.target.id==='coachForm'){e.preventDefault();startCoach(false)}});
function updPrev(){const f=UI.form,el=document.getElementById('cardPrev');if(el)el.innerHTML=playerCard({ovr:'??',pos:POS[f.pos].s,age:17,num:f.num,name:f.name||(EN?"Player":'Игрок'),club:f.club,nat:f.nat,posFull:POS[f.pos].n})}

/* ================= boot ================= */
function start(data){
  if(data&&data.Gs)G=migrate(JSON.parse(data.Gs));else if(data&&data.G)G=migrate(data.G);else{slotsTidy();const s=load();if(s&&(s.P||s.C)&&s.clubs)G=migrate(s)}
  if(G)SAVED=saveJSON(G);
  if(G&&G.room&&G.room.token&&!MP.sess){MP.sess={code:G.room.code,pid:G.room.pid,token:G.room.token};mpSave()}
  if(data&&data.UI)Object.assign(UI,data.UI);
  else if(!G&&slotsGet().length)UI.tab='home';
  try{const q=new URLSearchParams(location.search).get('room');if(q&&/^[A-Z0-9]{4,6}$/i.test(q)){UI.mpCode=q.toUpperCase();UI.tab='multi';if(MP.sess&&MP.sess.code!==UI.mpCode)UI.mpSwitch=true;history.replaceState(null,'',location.pathname)}}catch(e){}
  adsLoad();
  render();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({Gs:SAVED,UI:{tab:UI.tab,tblLg:UI.tblLg,form:UI.form}}))}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
</script>

</html>
