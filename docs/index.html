<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08121B">
<meta name="description" content="Симулятор футбольной карьеры: 30 лиг, еврокубки, сборные, Золотой мяч.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Легенда поля">
<meta property="og:title" content="Легенда поля">
<meta property="og:description" content="Создай игрока и проведи его от академии до Золотого мяча.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Легенда поля</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Sofia+Sans+Extra+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08121B;--bg2:#0C1A27;--card:#10202F;--card2:#15293C;--line:#1E3850;--line2:#2B4D6C;
  --text:#E6EDF3;--muted:#8FA5B9;--dim:#5E7890;
  --amber:#FFB43F;--amber2:#FFD58A;--ink:#241500;--grass:#3CC47F;--red:#FF6B5B;--sky:#73B9F4;
  --disp:"Sofia Sans Extra Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--text);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button,select,summary,a,.opt,.tab{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn,.tab{min-height:44px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1,h2,h3{text-wrap:balance;margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 56px,transparent 56px 112px),rgba(8,18,27,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:18px;min-height:58px;flex-wrap:wrap;padding-block:6px}
.brand{font-family:var(--disp);font-weight:900;font-size:26px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--amber)}
.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tab{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:600}
.tab:hover{color:var(--text)}
.tab[aria-current="true"]{color:var(--ink);background:var(--amber)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);padding:10px 16px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--amber)}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.primary{background:var(--amber);color:var(--ink);border-color:var(--amber);font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:24px;letter-spacing:.02em;padding:12px 22px}
.btn.primary:hover{background:var(--amber2)}

main{padding-block:28px 80px;display:grid;gap:28px}
main>*,.grid2>*,.hero>*,.setup>*,.panel,.season,.status,.act,.tw{min-width:0}
.chart{max-width:100%}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:start}
.hero-t{font-size:clamp(54px,9vw,104px)}
.hero-t em{font-style:normal;color:var(--amber)}
.lead{max-width:58ch;color:var(--muted);margin:14px 0 0}
.form{display:grid;gap:14px;margin-top:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row2.namerow{grid-template-columns:minmax(0,1fr) 96px}
.field{display:grid;gap:6px}
.field label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field select{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.field input:focus,.field select:focus{border-color:var(--amber);outline:none}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:13.5px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--amber)}
.facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px}
.facts div{display:grid}
.facts b{font-family:var(--disp);font-size:34px;font-weight:900;color:var(--amber);line-height:1}
.facts span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

/* player card */
.fcard{position:relative;width:100%;max-width:300px;aspect-ratio:5/7;border-radius:20px;padding:20px;overflow:hidden;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 26px,transparent 26px 52px),linear-gradient(165deg,#1D3C5A 0%,#10253A 52%,#0A1724 100%);
  border:1px solid var(--line2);box-shadow:0 0 0 5px var(--bg),0 0 0 6px rgba(255,180,63,.55),0 30px 60px -20px rgba(0,0,0,.6);display:flex;flex-direction:column;justify-self:center}
.fcard .pitch{position:absolute;left:50%;bottom:-38%;width:120%;aspect-ratio:1;transform:translateX(-50%);border:1.5px solid rgba(255,180,63,.16);border-radius:50%}
.fcard .pitch::after{content:"";position:absolute;left:-10%;right:-10%;top:50%;border-top:1.5px solid rgba(255,180,63,.16)}
.fc-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.fc-ovr{font-family:var(--disp);font-weight:900;font-size:84px;line-height:.8;color:var(--amber)}
.fc-pos{font-family:var(--disp);font-weight:800;font-size:26px;color:var(--text);margin-top:4px}
.fc-age{text-align:right;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.fc-age b{display:block;font-family:var(--disp);font-size:40px;color:var(--text);letter-spacing:0;line-height:1}
.fc-name{margin-top:auto;position:relative;font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:clamp(30px,4vw,40px);line-height:.92;word-break:break-word}
.fc-meta{position:relative;display:grid;gap:2px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
.fc-meta span:first-child{color:var(--amber2);font-weight:600}
.fc-meta span{color:var(--muted)}

/* career hero */
.hero{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;align-items:start}
.status h1{font-size:clamp(40px,6vw,64px)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:18px}
.stat-grid>div{background:var(--card);padding:12px 14px;display:grid;gap:2px;min-width:0}
.stat-grid dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat-grid dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.stat-grid dd small{color:var(--muted);font-weight:400}
.go{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:20px}
.summer{margin-top:16px;display:grid;gap:6px;font-size:14px;color:var(--muted);padding-left:0;list-style:none}
.summer li::before{content:"→ ";color:var(--amber)}

/* totals strip */
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px}
.totals div{border-top:2px solid var(--line2);padding-top:8px}
.totals b{display:block;font-family:var(--disp);font-weight:900;font-size:44px;line-height:1}
.totals span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.totals .gold b{color:var(--amber)}

/* decision */
.decide{border:1.5px solid var(--amber);border-radius:18px;padding:22px;background:linear-gradient(180deg,rgba(255,180,63,.07),transparent 60%),var(--card)}
.d-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pips{display:flex;gap:5px}
.pips i{width:22px;height:5px;border-radius:3px;background:var(--line2)}
.pips i.on{background:var(--amber)}
.pips i.done{background:rgba(255,180,63,.4)}
.decide h2{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:38px;line-height:1}
.decide>p{color:var(--muted);max-width:70ch;margin:8px 0 16px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:10px}
.opt{text-align:left;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.opt:hover{border-color:var(--amber);background:#132A40}
.o-l{font-weight:700;font-size:16px}
.o-s{font-size:13px;color:var(--amber2)}
.o-d{font-size:13px;color:var(--muted)}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.bdg{font-size:11px;font-weight:700;letter-spacing:.06em;border-radius:5px;padding:1px 6px;background:var(--line);color:var(--text)}
.bdg.ucl{background:var(--sky);color:#04192b}
.bdg.warn{background:rgba(255,107,91,.18);color:var(--red)}

/* sections */
.sec-h{display:flex;align-items:baseline;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:34px;line-height:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.cabinet{display:flex;flex-wrap:wrap;gap:8px}
.tro{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,180,63,.45);background:rgba(255,180,63,.08);color:var(--amber2);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600}
.tro b{font-family:var(--mono);color:var(--amber)}
.aw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:13.5px}
.aw b{font-family:var(--mono);color:var(--sky)}
svg text{fill:var(--muted);font:11px var(--mono)}
.chart{width:100%;height:auto;display:block}

/* seasons */
.feed{display:grid;gap:14px}
.season{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.season.latest{border-color:var(--line2);background:var(--card2)}
.s-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.s-year{font-family:var(--disp);font-weight:900;font-size:40px;color:var(--amber);line-height:.9}
.s-club b{display:block;font-size:17px}
.s-club span{color:var(--muted);font-size:13px}
.s-ovr{font-family:var(--disp);font-weight:900;font-size:40px;line-height:.9;text-align:right}
.s-ovr small{display:block;font-family:var(--mono);font-size:12px;font-weight:700}
.up{color:var(--grass)}.down{color:var(--red)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 6px;background:var(--line2);color:var(--text);vertical-align:2px;margin-left:6px}
.kpis{display:flex;flex-wrap:wrap;gap:6px 22px}
.kpi{display:grid}
.kpi b{font-family:var(--mono);font-size:20px;font-weight:700}
.kpi span{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line2);border-radius:8px;padding:4px 10px;color:var(--muted)}
.chip b{color:var(--text);font-weight:600}
.chip.win{border-color:rgba(255,180,63,.6);color:var(--amber2)}
.chip.win b{color:var(--amber)}
.lines{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px;color:var(--muted)}
.lines li b{color:var(--text);font-weight:600}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600}
summary:hover{color:var(--text)}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
.t th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line2)}
.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.t th:nth-child(2),.t td:nth-child(2){text-align:left;font-family:var(--body)}
.t th:first-child,.t td:first-child{text-align:left;width:34px;color:var(--dim)}
.t tr.me td{background:rgba(255,180,63,.1);color:var(--amber2)}
.t tr.me td:nth-child(2){font-weight:700}
.t tr.zone td:first-child{box-shadow:inset 3px 0 0 var(--sky)}
.t tr.drop td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.t.small td,.t.small th{padding:5px 8px}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--amber);vertical-align:middle}
.trend-up{color:var(--grass)}.trend-down{color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:18px}
.selrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.selrow select{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;max-width:100%}

/* hall of fame */
.hof{border:1.5px solid var(--amber);border-radius:22px;padding:26px;background:
  radial-gradient(120% 90% at 100% 0%,rgba(255,180,63,.14),transparent 60%),var(--card);display:grid;gap:24px}
.hof h1{font-size:clamp(46px,8vw,92px)}
.tier{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:26px;color:var(--amber)}
.legend-row{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:14px}
.legend-row .trk{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.legend-row .trk i{display:block;height:100%;background:var(--line2);border-radius:5px}
.legend-row.me .trk i{background:var(--amber)}
.legend-row.me{color:var(--amber2);font-weight:700}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}

/* attributes, relations, records */
.attrs{display:grid;gap:8px}
.at-row{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:14px}
.at-row .trk,.rec-row .trk{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.at-row .trk i{display:block;height:100%;background:var(--line2);border-radius:4px}
.at-row.key .trk i{background:var(--amber)}
.at-row b{text-align:right}
.recs{display:grid;gap:10px}
.rec-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 44px;gap:12px;align-items:center;font-size:14px}
.rec-row div{display:grid;min-width:0}
.rec-row div span{color:var(--muted);font-size:12.5px}
.rec-row .trk i{display:block;height:100%;background:var(--sky);border-radius:4px}
.rec-row.mine b{color:var(--amber2)}
.rec-row.mine .trk i{background:var(--amber)}
.rec-row .num{text-align:right}
.rec{display:inline-flex;border:1px dashed rgba(255,180,63,.7);color:var(--amber2);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
/* perks, achievements, legacy */
.perks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:8px}
.perk{border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;display:grid;gap:3px;color:var(--dim)}
.perk b{font-size:14px;color:var(--muted)}
.perk span{font-size:12.5px}
.perk.on{border:1px solid rgba(255,180,63,.55);background:rgba(255,180,63,.06);color:var(--muted)}
.perk.on b{color:var(--amber2)}
.perk em{font-style:normal;font-size:13px;color:var(--amber);font-weight:600}
.perk em.neg{color:var(--red)}
.fc-num{display:block;font-family:var(--disp);font-size:22px;color:var(--amber2);letter-spacing:0;margin-top:4px}
/* jury */
.jury{display:grid;gap:6px;text-align:left;width:100%;max-width:640px;margin:6px auto 0}
.jury-h,.jury-r{display:grid;grid-template-columns:minmax(90px,130px) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;font-size:13.5px}
.jury-h b{font-size:12.5px;color:var(--muted);font-weight:600;overflow-wrap:anywhere}
.jury-r>div{display:flex;align-items:center;gap:6px;min-width:0}
.jb{display:block;height:8px;border-radius:4px;flex:0 1 auto}
.jb.me{background:var(--amber)}.jb.them{background:var(--sky)}
.jury-r em{font-style:normal;font-size:12px;color:var(--muted)}
/* ceremony */
.kopa{display:grid;gap:8px;justify-items:center;width:100%}
.cer{border:1.5px solid var(--amber);border-radius:22px;padding:26px;background:radial-gradient(90% 70% at 50% 0%,rgba(255,180,63,.2),transparent 65%),var(--card);display:grid;gap:14px;text-align:center}
.cer-win span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
.cer-win h1{font-size:clamp(46px,9vw,96px);color:var(--amber2)}
.cer-win p{margin:4px 0 0;color:var(--muted)}
.cer-you{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:28px;margin:0}
.cer-list{list-style:none;margin:0 auto;padding:0;display:grid;gap:4px;width:100%;max-width:560px;text-align:left}
.cer-list li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:6px 10px;border-radius:8px;background:var(--bg2)}
.cer-list li b{font-weight:600}
.cer-list li em{font-style:normal;color:var(--muted);font-size:13px}
.cer-list li.me{background:rgba(255,180,63,.16);outline:1px solid var(--amber)}
.cer-list li.mate{outline:1px solid var(--sky)}
.cer-list li:nth-child(-n+3) .num{color:var(--amber)}
.cer .go{justify-content:center}
@media (prefers-reduced-motion:no-preference){.cer-list li{animation:rise .4s ease-out both;animation-delay:calc(var(--i)*35ms)}}
/* head to head */
.h2h-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px}
.h2h{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:14px}
.h2h-top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:6px}
.h2h-top b{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:22px;overflow-wrap:anywhere}
.h2h-top b:last-child{text-align:right}
.h2h-top .num{font-family:var(--disp);font-weight:900;font-size:34px;color:var(--amber)}
.h2h-r{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
.h2h-r em{font-style:normal;color:var(--muted);text-align:center}
.h2h-r span:last-child{text-align:right}
.h2h-r .win{color:var(--amber);font-weight:700}
/* multiplayer */
.roster{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.roster li{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.roster li.me{border-color:var(--amber)}
.roster li div{display:grid;min-width:0}
.roster li span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.roster li .num{font-family:var(--disp);font-weight:900;font-size:28px;color:var(--amber)}
.rdy{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-radius:6px;padding:3px 8px;background:var(--line);white-space:nowrap}

.btn.mini{min-height:32px;padding:5px 10px;font-size:12.5px}
.roster.slots li{flex-wrap:wrap}
.btn[disabled]{opacity:.5;pointer-events:none}
/* rare events, modal */
.decide.egg{border-color:#FFD58A;background:linear-gradient(135deg,rgba(255,213,138,.16),transparent 55%),var(--card);box-shadow:0 0 0 1px rgba(255,213,138,.35),0 20px 50px -20px rgba(255,180,63,.35)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,8,13,.86);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.modal-in{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:16px;max-width:460px;width:100%;max-height:100%;overflow:auto;display:grid;gap:10px}
.modal-in img{width:100%;border-radius:10px;display:block}

.goal{max-width:420px;margin:6px auto 0;padding:10px 10px 0;border:6px solid #E9EEF3;border-bottom:0;border-radius:6px 6px 0 0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 12px),#07101A}
.net{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-bottom:10px}
.cell{aspect-ratio:3/2;border-radius:6px;border:1px dashed rgba(255,255,255,.18);background:rgba(255,255,255,.03);position:relative;display:block}
button.cell{cursor:pointer}
button.cell:hover,button.cell:focus-visible{background:rgba(255,180,63,.22);border-color:var(--amber)}
.cell.mine{background:rgba(255,107,91,.28);border-color:var(--red)}
.cell.reach{background:rgba(255,180,63,.22);border-color:var(--amber)}
.cell.hit::after,.cell.miss::after{content:"";position:absolute;inset:0;margin:auto;width:34%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--bg)}
.cell.miss::after{background:var(--red)}
.cell.dive{outline:2px solid var(--amber)}
.bigm.won{border-color:var(--grass)}
.bigm.lost{border-color:var(--red)}

.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center;background:#050C13;border:1px solid var(--line2);border-radius:14px;padding:16px 18px;margin:4px 0 16px}

  const cc=C(S.clubId).cc;P.cy[cc]=(P.cy[cc]||0)+1;
  if(S.bdo&&(P.bdoBest==null||S.bdo.place<P.bdoBest))P.bdoBest=S.bdo.place;

function worldUpdate(tables,res){
  const P=G.P,my=S.clubId;
  const eb={'Победитель':1.6,'Финал':1,'1/2 финала':.6,'1/4 финала':.3};
  G.leagues.forEach(lg=>{
    const t=tables[lg.id],n=t.length,exp=lg.ids.slice().sort((a,b)=>C(b).str-C(a).str);
    t.forEach((r,i)=>{
      const c=C(r.id),ei=exp.indexOf(r.id);
      let d=(ei-i)/n*3.2+(c.base-c.str)*.15+gauss()*1.1;
      if(i===0)d+=.6;
      const coachRoll=R();if(ei-i<-n/3&&coachRoll<.55){d+=gauss()*1.6;if(c.id===my||(lg.id===S.lgId&&c.str>=75))S.news.push(`«${c.name}» уволил главного тренера после ${i+1}-го места.`)}
      ['ucl','uel','uecl'].forEach(k=>{if(res[k]&&eb[res[k].reached[c.id]])d+=eb[res[k].reached[c.id]]*(k==='ucl'?1:.5)});
      (S.stars||[]).forEach(([cid,ov])=>{if(cid===c.id)d+=clamp((ov-c.str)*.04,0,.8)});
      c.str=clamp(c.str+d,42,94);
      c.base+=(c.str-c.base)*.15;
    });
  });
  G.nations.forEach(n=>{n.str=clamp(n.str+(n.base-n.str)*.1+gauss()*.7,28,93)});
  updRivals();
}
function promote(tables,a,b,k){
  const A=LG(a),B=LG(b),down=tables[a].slice(-k).map(r=>r.id),up=tables[b].slice(0,k).map(r=>r.id);
  A.ids=A.ids.filter(i=>!down.includes(i)).concat(up);B.ids=B.ids.filter(i=>!up.includes(i)).concat(down);
  down.forEach(i=>{C(i).lg=b;C(i).str-=1.5});up.forEach(i=>{C(i).lg=a;C(i).str+=1.5});
  if(down.includes(S.clubId)&&S.role>=3)S.anom.push({t:'relegated',club:S.clubName});
  if(down.includes(S.clubId))S.news.push(`«${S.clubName}» вылетел из лиги «${A.name}».`);
  if(up.includes(S.clubId))S.promoted=true;if(up.includes(S.clubId))S.news.push(`«${S.clubName}» выходит в «${A.name}»!`);
}
function updRivals(){
  const Y=G.year+1;
  G.rivals.forEach(r=>{
    const age=Y-r.by;let d=age<=21?ri(1,4):age<=24?ri(0,3):age<=28?ri(-1,1):age<=31?ri(-2,0):ri(-3,-1);
    if(d>0)d=Math.min(d,Math.max(0,r.pot-r.ovr));
    r.ovr=clamp(r.ovr+d,60,96);
    const c=C(r.club);
    const mv=R(),mv2=R();if(age<30&&r.ovr>c.str+5&&mv<.35){const tops=G.clubs.filter(x=>x.str>=c.str+4&&x.cc!=='RUS').sort((a,b)=>b.str-a.str).slice(0,14);if(tops.length)r.club=pick(tops).id}
    else if(age>=31&&mv2<.12){r.club=pick(LG(pick(['KSA1','USA1'])).ids)}
  });
  G.rivals=G.rivals.filter(r=>{const age=Y-r.by,roll=R();return !(age>=38||(age>=34&&roll<.35)||r.ovr<76)});
  const strong=G.nations.filter(n=>n.str>=74),topc=G.clubs.slice().sort((a,b)=>b.str-a.str).slice(0,28);
  while(G.rivals.filter(r=>r.pos==='GK').length<6){const age=ri(19,23),c=pick(G.clubs.slice().sort((a,b)=>b.str-a.str).slice(0,28));G.rivals.push({name:`${pick(FN)} ${pick(LN)}`,nat:pick(G.nations.filter(n=>n.str>=74)).id,club:c.id,pos:'GK',by:Y-age,ovr:ri(79,84),pot:ri(87,93)})}
  while(G.rivals.length<40){const age=ri(18,21);G.rivals.push({name:`${pick(FN)} ${pick(LN)}`,nat:pick(strong).id,club:pick(topc).id,pos:pick(['ST','ST','LW','RW','CAM','CM','CB','GK','CDM','LB','RB']),by:Y-age,ovr:ri(78,84),pot:ri(88,95)})}
}

function offerOpt(of,extra=''){

function makeOffer(c,free,mult=1){
  const P=G.P,v=marketValue();
  return {club:c.id,fee:free?0:r1(v*(.85+RP()*.6)),wage:r1(wageAt(c)*(1+RP()*.3)*mult*(P.agent?1.15:1)*(1+P.rep/400)),years:P.age<27?riP(3,5):P.age<31?riP(2,4):riP(1,2)};

function genOffers(n,free){
  const P=G.P,young=P.age<=21,target=young?Math.max(P.ovr,(P.ovr+P.pot)/2-4):P.ovr;
  let pool=G.clubs.filter(c=>c.id!==P.clubId&&P.ovr>=c.str-(young?14:9)&&c.str<=target+8&&allowedClub(c.id));
  if(pool.length<n)pool=G.clubs.filter(c=>c.id!==P.clubId).sort((a,b)=>Math.abs(a.str-P.ovr)-Math.abs(b.str-P.ovr)).slice(0,20);
  const out=[];
  for(let i=0;i<n&&pool.length;i++){const c=wpickP(pool,c=>Math.exp(-Math.abs(c.str-(target+1))/3.5)*Math.pow(LG(c.lg).wealth,.35));pool.splice(pool.indexOf(c),1);out.push(makeOffer(c,free))}
  return out;
}

function applyAct(a){
  if(a.t==='cfx'){applyCoachFx(a);return}
  const P=G.P,from=C(P.clubId),L=G.summer;
  switch(a.t){
    case 'transfer':{
      const to=C(a.club);
      if(a.block&&RP()<a.block){L.push(`«${from.name}» отказался отпускать вас в «${to.name}».`);break}
      if(a.loan){relOnMove(from,to,true);P.loanFrom=P.clubId;P.clubId=to.id;L.push(`Аренда в «${to.name}» на сезон.`);P.transfers.push({y:G.year,from:from.name,to:to.name,fee:0,loan:true})}
      else{relOnMove(from,to,false);P.clubId=to.id;P.contract=a.years;P.wage=a.wage;P.wantOut=false;L.push(`Переход в «${to.name}»: ${a.fee?fmtM(a.fee):'свободный агент'}, контракт на ${yrs(a.years)}, ${fmtW(a.wage)}.`);P.transfers.push({y:G.year,from:from.name,to:to.name,fee:a.fee,loan:false});P.maxFee=Math.max(P.maxFee||0,a.fee||0);if(G.rec.fee&&!G.rec.fee.mine&&a.fee>G.rec.fee.v)L.push(`Самый дорогой трансфер в истории футбола: ${fmtM(a.fee)}. Прежний рекорд — ${G.rec.fee.h}, €${G.rec.fee.v} млн.`)}
      G.moved=true;break}
    case 'renew':P.contract=a.years;P.wage=a.wage;L.push(`Новый контракт с «${from.name}» на ${yrs(a.years)}, ${fmtW(a.wage)}.`);break;
    case 'demand':if(RP()<a.ch){P.contract=a.years;P.wage=a.wage;L.push(`Клуб уступил: новый контракт на ${yrs(a.years)}, ${fmtW(a.wage)}.`)}else L.push(`«${from.name}» отказался поднимать зарплату. Контракт не продлён.`);break;
    case 'wantOut':P.wantOut=true;L.push('Агент получил задание искать новый клуб.');break;
    case 'fight':P.fight=true;L.push('Вы решили доказать всё на тренировках.');break;
    case 'natSwitch':L.push(`Вы сменили сборную: теперь играете за «${N(a.nat).name}».`);P.nat=a.nat;break;
    case 'intlRetire':P.intlRetired=true;P.retireAge+=.6;L.push('Вы завершили карьеру в сборной.');break;
    case 'intlBack':P.intlRetired=false;L.push('Вы вернулись в сборную.');break;
    case 'retire':doRetire('choice');break;
    case 'cfx':applyCoachFx(a);break;
    case 'fx':applyFx(a);break;
  }
}

const ATTR=['pac','sho','pas','def','phy'];
const ATTR_N={pac:'Скорость',sho:'Удар',pas:'Пас',def:'Защита',phy:'Физика'};
const ATTR_GK={pac:'Реакция',sho:'Игра на выходах',pas:'Игра ногами',def:'Позиционирование',phy:'Физика'};
const AW={ST:[.2,.45,.15,0,.2],LW:[.35,.25,.25,0,.15],RW:[.35,.25,.25,0,.15],CAM:[.15,.25,.45,0,.15],CM:[.1,.15,.4,.2,.15],CDM:[.1,.05,.3,.35,.2],LB:[.3,.05,.2,.3,.15],RB:[.3,.05,.2,.3,.15],CB:[.15,0,.1,.5,.25],GK:[.35,.2,.1,.25,.1]};
const attrName=k=>(G.P.pos==='GK'?ATTR_GK:ATTR_N)[k];
function calcOvr(at,pos){const w=AW[pos];return ATTR.reduce((s,k,i)=>s+at[k]*w[i],0)}
function makeAttrs(ovr,pos){const w=AW[pos],at={};ATTR.forEach((k,i)=>at[k]=ovr+(w[i]-.2)*40+gaussP()*3);const d=ovr-calcOvr(at,pos);ATTR.forEach(k=>at[k]=r1(clamp(at[k]+d,20,99)));return at}
function syncOvr(){const P=G.P;P.ovr=clamp(calcOvr(P.at,P.pos),40,97)}
function addOvr(d){const P=G.P;ATTR.forEach(k=>P.at[k]=clamp(P.at[k]+d,20,99));syncOvr()}
/* g = overall growth for the season; pace fades first, passing ages best; the training focus shifts growth into one attribute */
function developAttrs(g,age){
  const P=G.P,f=P.focus||'bal',NEG={pac:1.2,sho:.9,pas:.6,def:.85,phy:1.1};
  ATTR.forEach(k=>{
    let d=g>0?g*(.75+RP()*.5):g*NEG[k];
    if(f===k)d+=g>0?.9+g*.35:.6;else if(f!=='bal'&&g>0)d-=.2;
    if(age>=28&&k==='pac')d-=Math.min(.8,(age-27)*.07);
    if(age>=24&&age<=32&&k==='pas')d+=.25;
    const cap=Math.max(P.at[k],P.pot+(f===k?6:3));
    P.at[k]=r1(clamp(Math.min(P.at[k]+d,d>0?cap:99),35,99));
  });
  syncOvr();
}

const freshRel=()=>({coach:55,team:50,fans:50});

function relLabel(v){return v<25?'конфликт':v<45?'холодно':v<60?'нормально':v<80?'хорошо':'обожание'}
function relSeason(avg,ratio,derby){
  const P=G.P,r=P.rel,c=S.club,tw=S.trophies.length;
  r.coach+=(avg-6.9)*12+(ratio>.6?3:ratio<.25?-4:0)+gaussP()*3;
  r.team+=(tw?3:0)+(P.captain===P.clubId?2:0)+(S.lgPos<=3?1:-1)+gaussP()*3;
  r.fans+=c.g*.35+c.a*.2+tw*4+(derby.w*(hasPerk('derby')?2:1)-derby.l)*3+(avg-6.9)*8+(P.wantOut?-8:0);
  ['coach','team','fans'].forEach(k=>r[k]=Math.round(clamp(r[k]+(50-r[k])*.08,0,100)));
  if(hasPerk('leader'))r.team=Math.max(r.team,60);
  if(hasPerk('flag'))r.fans=Math.max(r.fans,60);
}
function relOnMove(from,to,loan){
  const P=G.P,L=G.summer;
  if(loan){P.relSaved=P.rel;P.rel=freshRel();return}
  const rivalOfPast=playedClubs(2).filter(id=>isDerby(id,to.id));
  P.clubRel[from.id]=Math.round(P.rel.fans-(P.wantOut?25:0)-(isDerby(from.id,to.id)?70:0));
  rivalOfPast.forEach(id=>{P.clubRel[id]=Math.min(P.clubRel[id]??50,-60);L.push(`Болельщики «${C(id).name}» сжигают футболки с вашей фамилией: переход к злейшему врагу.`)});
  if(rivalOfPast.length)P.rep=clamp(P.rep-3,0,100);
  P.rel=freshRel();if(hasPerk('globe')){P.rel.coach=65;P.rel.team=60}
  const back=P.clubRel[to.id];
  if(back!=null){P.rel.fans=clamp(back,0,100);L.push(back>=65?`Возвращение в «${to.name}»: трибуны встречают вас овацией.`:back<35?`Возвращение в «${to.name}»: на первой тренировке вас освистали.`:`Возвращение в «${to.name}»: болельщики настроены сдержанно.`)}
  else if(rivalOfPast.length)P.rel.fans=30;
  if(P.rep>60)P.rel.fans=clamp(P.rel.fans+6,0,100);
}

/* ================= club legacy ================= */
function computeLegacy(){
  const P=G.P,m=new Map();
  G.seasons.slice().reverse().forEach(s=>{if(s.loan)return;const v=m.get(s.clubId)||{id:s.clubId,n:s.clubName,s:0,g:0,apps:0,t:0};v.s++;v.g+=s.club.g;v.apps+=s.club.apps;v.t+=s.trophies.length;m.set(s.clubId,v)});
  const last=G.seasons[0]?G.seasons[0].clubId:null,out=[];
  m.forEach(v=>{
    const fans=v.id===P.clubId||v.id===last?P.rel.fans:(P.clubRel[v.id]??50),h=[];
    if(fans<=-30){h.push('Персона нон грата: болельщики так и не простили уход');}
    else{
      if((v.s>=10&&v.t>=5&&fans>=75)||(v.g>=200&&fans>=60))h.push('Статуя у стадиона');
      if(v.s>=7&&(v.t>=3||v.g>=100||v.apps>=300)&&fans>=65)h.push(`Номер ${P.num} выведен из обращения`);
      if(v.s>=5&&fans>=55)h.push('Зал славы клуба');
      if(v.id===last&&v.s>=3&&fans>=50)h.push('Прощальный матч при полном стадионе');
    }
    if(h.length)out.push({club:v.n,h,s:v.s,g:v.g,t:v.t});
  });
  if(P.retired&&P.retired.why==='ban')out.unshift({club:'ФИФА',h:['Персона нон грата: пожизненная дисквалификация'],s:0,g:0,t:0});
  return out;
}

function finalArc(won,comp){

  if(won){
    if(P.finStreak>=2){award('Проклятие финалов снято');S.news.push(`Проклятие финалов снято: после ${P.finStreak} проигранных финалов подряд вы взяли ${comp}.`);P.curseBroken=true}
    P.finStreak=0;
  }else{
    P.finStreak++;
    if(P.finStreak===2)S.news.push('Пресса заговорила о «проклятии финалов»: два проигранных финала подряд.');
    else if(P.finStreak>2)S.news.push(`${P.finStreak}-й проигранный финал подряд. Проклятие крепчает.`);
  }
}

  }

function feudLine(all,me){

  const i=all.findIndex(x=>x.name===P.feud.n);if(i<0)return;
  const mine=all.indexOf(me)+1,his=i+1;

}

async function careerImage(){
  const P=G.P,W=1080,H=1920,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');

  const D='"Sofia Sans Extra Condensed","Arial Narrow",sans-serif',B='"Golos Text",system-ui,sans-serif',M='"JetBrains Mono",monospace';
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1A3552');g.addColorStop(.45,'#0E2034');g.addColorStop(1,'#060E16');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.025)';for(let i=0;i<H;i+=120)x.fillRect(0,i,W,60);
  x.strokeStyle='rgba(255,180,63,.14)';x.lineWidth=4;x.beginPath();x.arc(W/2,H+260,560,0,Math.PI*2);x.stroke();
  x.strokeStyle='#FFB43F';x.lineWidth=6;x.strokeRect(36,36,W-72,H-72);
  const txt=(t,px,py,font,color,align='left')=>{x.font=font;x.fillStyle=color;x.textAlign=align;x.fillText(t,px,py)};

function legacyTier(){const score=legacyScore();return score>=170?'Величайший в истории':score>=100?'Легенда мирового футбола':score>=52?'Звезда своего поколения':score>=22?'Игрок топ-уровня':score>=8?'Надёжный профессионал':'Трудяга футбола'}
function legacyScore(){
  const P=G.P,cnt=n=>P.trophies.filter(t=>t.n===n).length,gk=P.pos==='GK';
  const bdo=P.awards.filter(a=>a.n==='Золотой мяч').length,ya=P.awards.filter(a=>a.n==='Трофей Яшина').length;
  const peak=Math.max(...P.ovrHist.map(h=>h.ovr)),lt=P.trophies.filter(t=>LEAGUE_DATA.some(l=>l[2]===t.n)).length;
  const score=bdo*30+(gk?ya*22:ya*5)+cnt('Лига чемпионов')*8+cnt('Чемпионат мира')*15+(cnt('Чемпионат Европы')+cnt('Копа Америка'))*8+lt*3+P.tot.g*.05+Math.max(0,peak-80)*2+(P.bdoBest&&P.bdoBest<=3?5:0)+P.awards.length*.8-(P.fixed&&P.retired&&P.retired.why==='ban'?40:0);
  return score;
}

function genEvents(){
  const out=[],pool=EVENTS.slice();
  const want=RP()<.75?(RP()<.4?2:1):0;
  for(let tries=0;out.length<want&&pool.length&&tries<12;tries++){
    const e=wpickP(pool,x=>x.w);pool.splice(pool.indexOf(e),1);
    const d=e.f();if(d)out.push(d);
  }
  return out;
}
function applyFx(fx){
  const P=G.P;
  if(fx.chance!=null&&RP()>fx.chance)fx=fx.fail||{};
  if(fx.rep)P.rep=clamp(P.rep+fx.rep,0,100);
  if(fx.money)P.earn+=fx.money*1e6;
  if(fx.roleMod)P.roleMod+=fx.roleMod;
  if(fx.growMod)P.growMod+=fx.growMod;
  if(fx.inj)P.inj=Math.max(P.inj,fx.inj);
  if(fx.ovr)addOvr(fx.ovr);
  ['coach','team','fans'].forEach(k=>{if(fx[k])P.rel[k]=Math.round(clamp(P.rel[k]+fx[k],0,100))});
  if(fx.coachSet)P.rel.coach=fx.coachSet;
  if(fx.contractAdd){P.contract+=fx.contractAdd;P.wage=r1(P.wage*1.1)}
  if(fx.pot)P.pot+=fx.pot;
  if(fx.retire)P.retireAge=r1(P.retireAge+fx.retire);
  if(fx.agent)P.agent=true;
  if(fx.diet)P.diet=true;
  if(fx.fund)P.fund=true;
  if(fx.doc)P.doc=true;
  if(fx.ntCaptain)P.ntCaptain=true;
  if(fx.captain)P.captain=P.clubId;
  if(fx.pos){P.pos=fx.pos;syncOvr()}
  if(fx.sponsor)P.sponsor={y:fx.sponsor,m:fx.spM};
  if(fx.wantOut)P.wantOut=true;
  if(fx.inj>=12)comebackStart();
  if(fx.wageMul)P.wage=r1(P.wage*fx.wageMul);
  if(fx.clubStr){const c=C(P.clubId);c.str=clamp(c.str+fx.clubStr,42,94)}
  if(fx.clubBase){const c=C(P.clubId);c.base=clamp(c.base+fx.clubBase,42,94)}
  if(fx.clubStr||fx.clubBase){P.wfx=P.wfx||[];P.wfx.push({k:`${MP.sess?MP.sess.pid:'solo'}-${G.year}-${P.wfx.length}`,club:P.clubId,str:fx.clubStr||0,base:fx.clubBase||0})}
  if(fx.qMod)P.qMod=fx.qMod;
  if(fx.skipNT)P.skipNT=1;
  if(fx.fixed)P.fixed=true;
  if(fx.intlRetire)P.intlRetired=true;
  if(fx.natSet!=null)P.nat=fx.natSet;
  if(fx.nat2Clear)P.nat2=null;
  if(fx.freeNow){P.contract=0;G.pending.splice(1,0,freeAgentDecision());G.pendTotal++}
  if(fx.log)G.summer.push(fx.log);
}

async function api(path,body){

}

function h2hData(a,b){
  const A=a.progress,B=b.progress,ha=(A.h2h||{})[b.id],hb=(B.h2h||{})[a.id];

  let aw=0,bw=0;for(const y in (A.places||{}))if(B.places&&B.places[y]!=null){if(A.places[y]<B.places[y])aw++;else if(B.places[y]<A.places[y])bw++}

  const rows=[
    ['Очные матчи (победы)',m?m.w:0,m?m.l:0,1,m?`${m.w}–${m.d}–${m.l}, мячи ${m.gf}:${m.ga}`:'не встречались'],
    ['Голы в очных матчах',(ha||{}).g||0,(hb||{}).g||0,1],
    ['Выше в Золотом мяче, сезонов',aw,bw,1],
    ['Очки наследия',A.score||0,B.score||0,1],
    ['Трофеи',A.tro,B.tro,1],
    [gk?'Трофеи Яшина':'Золотые мячи · Яшины',A.bdo,B.bdo,1],
    ['Лучшее место в Золотом мяче',A.best||99,B.best||99,-1],
    ['Пик рейтинга',A.peak||A.ovr,B.peak||B.ovr,1],
    ['Матчи',A.apps||0,B.apps||0,1],
    ...(gk?[['Сухие матчи',A.cs||0,B.cs||0,1]]:[['Голы',A.g,B.g,1]]),
    ['Передачи',A.a,B.a,1],
    ['Матчи за сборную',A.caps||0,B.caps||0,1],
  ];
  let sa=0,sb=0;rows.forEach(r=>{const d=(r[1]-r[2])*r[3];if(d>0)sa++;else if(d<0)sb++});
  return {rows,sa,sb,m};
}

const SQUAD_POS=['GK','GK','GK','CB','CB','CB','CB','LB','LB','RB','RB','CDM','CDM','CM','CM','CM','CAM','CAM','LW','LW','RW','RW','ST','ST','ST'];
const SCHEMES={'4-3-3':['GK','LB','CB','CB','RB','CDM','CM','CM','LW','ST','RW'],'4-2-3-1':['GK','LB','CB','CB','RB','CDM','CDM','CAM','LW','RW','ST'],'4-4-2':['GK','LB','CB','CB','RB','LW','CM','CM','RW','ST','ST'],'3-5-2':['GK','CB','CB','CB','LB','RB','CDM','CM','CAM','ST','ST'],'5-3-2':['GK','LB','CB','CB','CB','RB','CDM','CM','CM','ST','ST']};
const STYLES={press:{n:'Прессинг',d:'Давим высоко: больше голов в обе стороны, больше травм',own:1.08,opp:1.03,inj:1.5},counter:{n:'Контратаки',d:'Отдаём мяч и бьём на скорости: сильно против фаворитов',own:1,opp:.93,inj:1},poss:{n:'Владение',d:'Контроль мяча. Работает, если тактика тренера от 60',own:1.05,opp:.95,inj:1},def:{n:'Оборона',d:'Автобус: мало голов в обе стороны',own:.85,opp:.8,inj:.9}};
const FIT_GROUP={GK:'G',CB:'D',LB:'F',RB:'F',CDM:'M',CM:'M',CAM:'A',LW:'W',RW:'W',ST:'S'};
function fitPenalty(pl,slot){if(pl===slot)return 0;const a=FIT_GROUP[pl],b=FIT_GROUP[slot];if(a===b)return 2;const near={D:'MF',F:'DW',M:'DA',A:'MSW',W:'FAS',S:'AW'};if(a==='G'||b==='G')return 30;return (near[a]||'').includes(b)?5:12}
let PID=1;
function mkPlayer(pos,ovr,age,o={}){return {id:o.id||('p'+Date.now().toString(36)+(PID++)),name:o.name||`${pick(FN)} ${pick(LN)}`,pos,age,ovr:r1(clamp(ovr,40,95)),pot:Math.round(clamp(o.pot||ovr+Math.max(0,(24-age))*ri(1,3),ovr,96)),contract:o.contract||ri(1,4),star:!!o.star,academy:!!o.academy,inj:0,apps:0,g:0,a:0}}
function genSquad(club){
  const base=club.str-2,stars=G.rivals.filter(r=>r.club===club.id),used=new Set(),sq=[];
  stars.forEach(r=>{sq.push(mkPlayer(r.pos,r.ovr,G.year+1-r.by,{name:r.name,star:true,pot:r.pot}));used.add(r.pos)});
  const need=SQUAD_POS.slice();stars.forEach(r=>{const i=need.indexOf(r.pos);if(i>=0)need.splice(i,1)});
  // first choice per position is close to the club level, depth is weaker
  const seen={};
  need.forEach(pos=>{const k=(seen[pos]=(seen[pos]||0)+1);const lvl=base+(k===1?ri(-2,2):k===2?ri(-6,-2):ri(-12,-6));sq.push(mkPlayer(pos,lvl,ri(19,32)))});
  return sq;
}
function bestXI(sq,scheme){
  const slots=SCHEMES[scheme].slice(),pool=sq.filter(p=>!p.inj),xi=[];
  const order=slots.map((s,i)=>[s,i]).sort((a,b)=>(a[0]==='GK'?-1:0)-(b[0]==='GK'?-1:0));
  for(const [slot] of order){let best=null,bv=-1;for(const p of pool){if(xi.includes(p))continue;const v=p.ovr-fitPenalty(p.pos,slot);if(v>bv){bv=v;best=p}}if(best)xi.push({p:best,slot,eff:bv})}
  const avg=xi.length?xi.reduce((s,x)=>s+x.eff,0)/11:50;
  return {xi,avg};
}
function squadStrength(){
  const C0=G.C,sq=C0.squad,xi=bestXI(sq,C0.tactic.scheme);
  const depth=sq.filter(p=>!p.inj).sort((a,b)=>b.ovr-a.ovr).slice(11,18).reduce((s,p)=>s+p.ovr,0)/7;
  return {base:xi.avg+2+clamp((depth-xi.avg+8)*.08,-1,.6),xi};
}
function coachFx(){
  const C0=G.C,sk=C0.skills,st=C0.staff||[];
  const ass=st.find(x=>x.role==='ass');
  let fx=(sk.tac-50)/15+(sk.mot-50)/35+(C0.rel.team-50)/40+(ass?ass.lvl*.3:0);
  if(C0.tactic.style==='poss'&&sk.tac<60)fx-=1;

function jobOffers(n){
  const C0=G.C,top=55+C0.rep*.38,low=top-12;
  let pool=G.clubs.filter(c=>c.str<=top&&c.str>=low&&c.id!==C0.clubId&&allowedClub(c.id));
  if(pool.length<n)pool=G.clubs.filter(c=>c.id!==C0.clubId).sort((a,b)=>Math.abs(a.str-top+4)-Math.abs(b.str-top+4)).slice(0,12);
  const out=[];for(let i=0;i<n&&pool.length;i++){const c=wpick(pool,c=>Math.exp(-Math.abs(c.str-(top-4))/4));pool.splice(pool.indexOf(c),1);out.push(c)}
  return out;
}
function prestige(c){return (c.init||c.str)+Math.log(Math.max(1,LG(c.lg).wealth))*1.5}
function budgetFor(c){const lg=LG(c.lg);return r1(Math.max(1,Math.exp(((c.init||c.str)-60)*.12)*lg.wealth*.55))}
function jobOffersDecision(first){

  if(!first)opts.push({label:'Подождать',sub:'Отдохнуть полсезона',detail:'Предложения придут снова',act:{t:'cfx',log:'Вы решили подождать с новой работой.'}});

}

/* ---- transfer market ---- */
function refreshMarket(){
  const C0=G.C;if(C0.job!=='club')return;
  const c=C(C0.clubId),scout=(C0.staff||[]).find(x=>x.role==='scout'),q=scout?scout.lvl*.8:0,summer=C0.phase==='summer';
  const xi=bestXI(C0.squad,C0.tactic.scheme).xi,weak=xi.slice().sort((a,b)=>a.eff-b.eff).slice(0,4).map(x=>x.slot);
  const n=summer?ri(4,5):ri(2,3),t=[],cap=prestige(c)+4;
  for(let i=0;i<n;i++){const pos=i<weak.length?weak[i]:pick(SQUAD_POS),age=ri(19,31),ovr=r1(clamp(Math.min(c.str+ri(-5,4)+q,cap-ri(0,3)),48,93)),p=mkPlayer(pos,ovr,age);p.fee=r1(playerValue(p)*(1.1-(C0.skills.trf-50)/250));{const pool=G.clubs.filter(x=>Math.abs(x.str-ovr)<6&&x.id!==c.id);p.club=(pool.length?pick(pool):G.clubs.filter(x=>x.id!==c.id).sort((a,b)=>Math.abs(a.str-ovr)-Math.abs(b.str-ovr))[0]).name}t.push(p)}
  // former team-mates from the playing career
  if(G.ex&&summer&&R()<.5){const r=G.rivals.find(r=>G.ex.clubs.includes(C(r.club).name)&&r.club!==c.id);if(r){const p=mkPlayer(r.pos,r.ovr,G.year+1-r.by,{name:r.name,star:true,pot:r.pot});p.fee=r1(playerValue(p)*1.25);p.club=C(r.club).name;p.ex=true;t.unshift(p)}}
  C0.market={targets:t,window:summer?'летнее':'зимнее'};
}
function playerValue(p){const af=p.age<=21?1.8:p.age<=24?1.5:p.age<=27?1.2:p.age<=29?1:p.age<=31?.7:p.age<=33?.4:.2;return .5*Math.exp((p.ovr-60)*.18)*af*(p.age<=23?1+Math.max(0,p.pot-p.ovr)*.03:1)}
function buyPlayer(id,mode){
  const C0=G.C,m=C0.market;if(!m)return;const p=m.targets.find(x=>x.id===id);if(!p)return;
  const price=r1(p.fee*(mode==='haggle'?.85:1));
  if(price>C0.budget){UI.cMsg=`Не хватает бюджета: нужно ${fmtM(price)}, есть ${fmtM(C0.budget)}.`;return}

function applyCoachFx(fx){

  ['pres','team','fans'].forEach(k=>{if(fx[k])C0.rel[k]=Math.round(clamp(C0.rel[k]+fx[k],0,100))});
  if(fx.budget)C0.budget=r1(Math.max(0,C0.budget+fx.budget));
  if(fx.skill)for(const k in fx.skill)C0.skills[k]=clamp(C0.skills[k]+fx.skill[k],20,99);
  if(fx.clubStr&&C0.clubId!=null){const c=C(C0.clubId);c.base=clamp(c.base+fx.clubStr,42,94)}
  if(fx.sellBest&&C0.squad.length){const p=C0.squad.slice().sort((a,b)=>b.ovr-a.ovr)[0];const fee=r1(playerValue(p));C0.squad=C0.squad.filter(x=>x!==p);C0.budget=r1(C0.budget+fee*(fx.sellBest));L.push(`${p.name} продан за ${fmtM(fee)}.`)}

  if(fx.contract)C0.contract=fx.contract;

  if(fx.growYoung){const p=C0.squad.find(x=>x.id===fx.growYoung);if(p){p.ovr=r1(Math.min(p.pot,p.ovr+riP(2,4)));G.summer.push(`${p.name} получил место в основе.`)}}
  if(fx.loanId){const p=C0.squad.find(x=>x.id===fx.loanId);if(p){p.loan=true;p.ovr=r1(Math.min(p.pot,p.ovr+riP(2,4)));G.summer.push(`${p.name} ушёл в аренду набираться опыта.`)}}
  if(fx.fireStaff){C0.staff=(C0.staff||[]).filter(s=>s.role!==fx.fireStaff);G.summer.push('Ассистент уволен.')}
  if(fx.youth){const y=fx.youth;if(y.go==='sign')C0.squad.push(y.p);else if(y.go==='loan'){y.p.loan=true;y.p.ovr=r1(y.p.ovr+ri(2,5));C0.squad.push(y.p)}}

  const sa0=A.str+teamFx(A)+(me===A?pm.team:0),sb0=B.str+teamFx(B)+(me===B?pm.team:0);
  const lam=(sa,sb)=>{let la=1.32*Math.exp((sa-sb)*.045),lb=1.32*Math.exp((sb-sa)*.045);if(S.style){if(me===A){la*=S.style.own;lb*=S.style.opp}else{lb*=S.style.own;la*=S.style.opp}}if(pm.opp){if(me===A)lb*=pm.opp;else la*=pm.opp}return [la,lb]};
  let [la,lb]=lam(sa0,sb0);
  let ga=poisson(la/2),gb=poisson(lb/2);
  const mg=()=>me===A?[ga,gb]:[gb,ga];
  const [h1,h2]=mg();
  const sub=yield {kind:'chalf',comp,st,title:'Перерыв',score:`${h1}:${h2}`,me:{n:me.name,s:Math.round(sa0)},op:{n:op.name,s:Math.round(me===A?sb0:sa0)},
    body:h1>h2?'Ведём. Как играем второй тайм?':h1<h2?'Проигрываем. Нужны замены?':'Ничья после первого тайма.',
    opts:[{label:'Атаковать',sub:'Второй нападающий',detail:'Больше голов в обе стороны'},{label:'Держать',sub:'Опорник вместо атакующего',detail:'Меньше голов в обе стороны'},{label:'Ничего не менять',sub:'План работает',detail:''}]};
  const sm=[[1.35,1.15],[.75,.7],[1,1]][sub|0]||[1,1];
  if(me===A){la*=sm[0];lb*=sm[1]}else{lb*=sm[0];la*=sm[1]}
  ga+=poisson(la/2);gb+=poisson(lb/2);
  let et=false,pens=null,pk=null;
  if(ga===gb){et=true;ga+=poisson(la/3);gb+=poisson(lb/3)}
  if(ga===gb){
    const takers=C0.job==='club'?C0.squad.filter(p=>!p.inj&&p.pos!=='GK').sort((a,b)=>b.ovr-a.ovr).slice(0,5):[];
    const kicker=takers[0],diff=(me.str+teamFx(me))-op.str,n=clamp(Math.round(4-diff/5),1,6),mines=shuffle([0,1,2,3,4,5,6,7,8]).slice(0,n);
    const i=yield {kind:'pens',gk:false,comp,st,title:'Серия пенальти',me:{n:me.name,s:Math.round(me.str)},op:{n:op.name,s:Math.round(op.str)},mines:n,opts:[],
      body:`4:4 в серии, соперник только что не забил. Бьёт ${kicker?kicker.name:'ваш лучший пенальтист'}. Забьёт — трофей ваш. Мин на воротах: ${n} из 9, чем сильнее ваша команда, тем их меньше. Куда бить?`};
    const cell=clamp(i|0,0,8),scored=!mines.includes(cell),win=scored||R()<.45;
    pk={gk:false,cell,mines,txt:scored?`${kicker?kicker.name:'пенальтист'} бьёт в ${CELLN[cell]} — гол`:`${kicker?kicker.name:'пенальтист'} бьёт в ${CELLN[cell]} — мимо`,scored,win};
    pens=win?(me===A?'A':'B'):(me===A?'B':'A');
  }
  if(o.euro)coefRes(A,B,ga,gb);
  const w=ga>gb?A:gb>ga?B:(pens==='A'?A:B);reached[(w===A?B:A).id]=st;
  const [f,x]=mg(),won=w===me,r={ga,gb,et,pens};
  addLog(comp,`Финал — ${op.name} ${f}:${x}${ET(r)} · ${won?'победа':'поражение'}`);
  S.moments.push(`${comp}: финал против «${op.name}» ${f}:${x}${ET(r)} — ${won?'трофей!':'поражение'}`);
  yield {kind:'result',comp,st,title:won?'Победа!':'Поражение',won,score:`${f}:${x}${ET(r)}`,me:{n:me.name,s:Math.round(me.str)},op:{n:op.name,s:Math.round(op.str)},pk,
    lines:[`План: «${['Сильнейший состав','Сюрприз-тактика','Речь в раздевалке'][plan|0]}», в перерыве: «${['Атаковать','Держать','Ничего не менять'][sub|0]}».`,pk?`Серия пенальти: ${pk.txt}.`:'',won?`${comp}: трофей ваш!`:`${comp}: трофей уходит сопернику.`].filter(Boolean),opts:[]};
  return w;
}

    <div class="fc-name">${esc(o.name)}</div>
    <div class="fc-meta"><span>${esc(o.club)}</span><span>${esc(o.nat)}</span><span>${esc(o.posFull)}</span></div></div>`;
}
function topbar(){
  const tabs=(G&&(G.P||G.C)?[['career',G.phase==='retired'?'Итоги':'Карьера'],['tables','Таблицы'],['world','Мир'],['multi','Мультиплеер'],['saves','Сохранения']]:[['career','Новая карьера'],['multi','Мультиплеер'],['saves','Сохранения']]).map(([k,l])=>`<button class="tab" data-a="tab" data-v="${k}" aria-current="${UI.tab===k}">${l}</button>`).join('');
  const nb=G&&(G.P||G.C)?`<button class="btn ghost" data-a="newYes">Новая карьера</button>`:'';
  return `<header class="top"><div class="wrap topin"><div class="brand"><i></i>Легенда поля</div><nav class="tabs">${tabs}</nav>${nb}</div></header>`;
}

        <div class="field"><label for="f-nat">Гражданство</label><select id="f-nat">${nats.map(n=>`<option ${n.name===f.nat?'selected':''}>${esc(n.name)}</option>`).join('')}</select></div>

        <p class="small muted" style="margin:0">Старт без громкого имени: клубы предложат работу по вашей репутации. Полный состав из 25 игроков, схема и стиль, трансферы в летнее и зимнее окно, цели президента. Бывшие игроки начинают тренерскую карьеру из Зала славы: с бонусом к репутации и в том же мире.</p>

          <div class="field"><label for="f-nat2">Второе гражданство</label><select id="f-nat2"><option value="" ${!f.nat2?'selected':''}>нет</option>${nats.filter(n=>n.name!==f.nat).map(n=>`<option ${n.name===f.nat2?'selected':''}>${esc(n.name)}</option>`).join('')}</select></div>

        <p class="small muted" style="margin:0">Каждая новая карьера — новый случайный мир. Играть с друзьями в одном мире — вкладка «Мультиплеер».</p>
        <div class="go"><button class="btn primary" type="submit">Начать карьеру</button><span class="small muted">Сила сборной «${esc(f.nat)}»: ${nat?nat.str:'—'} · ${nat?CONF_RU[nat.conf]:''}</span></div>

    <div id="cardPrev">${playerCard({ovr:'??',pos:POS[f.pos].s,age:17,num:f.num,name:f.name||'Игрок',club:f.club,nat:f.nat,posFull:POS[f.pos].n})}</div>

function chips(s){return s.comps.map(c=>`<span class="chip ${c.win?'win':''}">${esc(c.n)}: <b>${esc(c.st)}</b></span>`).join('')}
function kpi(v,l){return `<div class="kpi"><b>${v}</b><span>${l}</span></div>`}
function seasonCard(s,i){
  const c=s.club,avg=c.apps?(c.rs/c.apps).toFixed(2):'—',d=s.ovrAfter-s.ovrBefore,def=['GK','CB','LB','RB'].includes(G.P.pos);
  const intl=s.called?`<li><b>Сборная (${esc(s.natName)}):</b> ${s.intl.apps} ${plural(s.intl.apps,'матч','матча','матчей')}, ${s.intl.g} ${plural(s.intl.g,'гол','гола','голов')}, ${s.intl.a} пас., роль — ${ROLE[s.natRole].toLowerCase()}</li>`:(s.intlRet?'':`<li><b>Сборная (${esc(s.natName)}):</b> без вызова</li>`);
  const tourn=s.tourn.map(t=>`<li><b>${esc(t.n)}:</b> ${esc(t.st)}${t.called?esc(t.extra||''):' <span class="dim">(без вас)</span>'}</li>`).join('');
  const fd=s.feud?`<li><b>Вражда:</b> вы ${s.feud.me}-й в Золотом мяче, ${esc(s.feud.n)} — ${s.feud.him}-й</li>`:'';
  const dz=s.derby&&s.derby.w+s.derby.d+s.derby.l?`<li><b>Дерби:</b> ${s.derby.w}В ${s.derby.d}Н ${s.derby.l}П${s.derby.g?`, ваших голов — ${s.derby.g}`:''}</li>`:'';
  const recs=(s.records||[]).length?`<div class="cabinet">${s.records.map(x=>`<span class="rec">${esc(x)}</span>`).join('')}</div>`:'';
  const moms=(s.moments||[]).length?`<div><p class="eyebrow" style="margin:0 0 6px">Большие матчи</p><ul class="lines">${s.moments.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
  const bdo=s.bdo?`<li><b>Золотой мяч:</b> ${s.bdo.place<=30?`${s.bdo.place}-е место`:'вне топ-30'} · победитель — ${esc(s.bdo.top[0].n)} (${esc(s.bdo.top[0].c)})</li>`:'';
  const logs=Object.entries(s.log).map(([k,v])=>`<li><b>${esc(k)}</b><br>${v.map(esc).join('<br>')}</li>`).join('');
  const table=`<div class="tw"><table class="t small"><thead><tr><th>#</th><th>Клуб</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>Мячи</th><th>О</th></tr></thead><tbody>${s.table.map((r,k)=>`<tr class="${r[8]?'me':''}"><td>${k+1}</td><td>${esc(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}:${r[6]}</td><td>${r[7]}</td></tr>`).join('')}</tbody></table></div>`;
  return `<article class="season ${i===0?'latest':''}">
    <header class="s-head"><div class="s-year">${s.label}</div><div class="s-club"><b>${esc(s.clubName)}${s.loan?'<span class="tag">аренда</span>':''}</b><span>${esc(s.lgName)} · ${s.age} лет · ${ROLE[s.role]}</span></div><div class="s-ovr">${s.ovrAfter}<small class="${d>=0?'up':'down'}">${d>=0?'+':''}${d}</small></div></header>
    <div class="kpis">${kpi(c.apps,'матчи')}${G.P.pos==='GK'?kpi(c.cs,'сухие')+kpi(c.gc!=null?c.gc:'—','пропущено')+kpi(c.gc!=null&&c.apps?(c.gc/c.apps).toFixed(2):'—','пропущено за матч'):kpi(c.g,'голы')+kpi(c.a,'пасы')+(def?kpi(c.cs,'сухие'):'')}${kpi(avg,'ср. оценка')}${kpi(fmtM(s.value).replace('€',''),'стоимость, €')}</div>
    <div class="chips">${chips(s)}</div>
    ${s.trophies.length||s.awards.length?`<div class="cabinet">${s.trophies.map(t=>`<span class="tro">${esc(t)}</span>`).join('')}${s.awards.map(a=>`<span class="aw">${esc(a)}</span>`).join('')}</div>`:''}
    ${recs}${moms}
    <ul class="lines">${dz}${fd}${intl}${tourn}${bdo}${s.summer.map(x=>`<li>${esc(x)}</li>`).join('')}${s.news.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    ${s.bdo&&s.bdo.mine?`<details><summary>Голосование за Золотой мяч: ${s.bdo.place}-е место</summary>${juryBlock(s.bdo)}</details>`:''}
    <details><summary>Таблица и путь в турнирах</summary><div class="grid2" style="margin-top:10px">${table}<ul class="lines">${logs||'<li>Кубковых матчей не было.</li>'}</ul></div></details>
  </article>`;
}
function groupCount(list){const m=new Map();list.forEach(x=>m.set(x.n,(m.get(x.n)||0)+1));return [...m.entries()].sort((a,b)=>b[1]-a[1])}
function cabinet(){
  const P=G.P,t=groupCount(P.trophies),a=groupCount(P.awards);
  if(!t.length&&!a.length)return '<p class="muted small">Пока пусто. Первый трофей где-то впереди.</p>';
  return `<div class="cabinet">${t.map(([n,k])=>`<span class="tro">${esc(n)}${k>1?` <b>×${k}</b>`:''}</span>`).join('')}${a.map(([n,k])=>`<span class="aw">${esc(n)}${k>1?` <b>×${k}</b>`:''}</span>`).join('')}</div>`;
}
function chart(){
  const h=G.P.ovrHist;if(h.length<2)return '<p class="muted small">График появится после первого сезона.</p>';
  const W=680,H=190,l=34,r=40,t=14,b=26,vals=h.map(x=>x.ovr);
  const lo=Math.floor((Math.min(...vals)-2)/5)*5,hi=Math.ceil((Math.max(...vals)+2)/5)*5;
  const X=i=>l+i*(W-l-r)/(h.length-1),Yv=v=>t+(hi-v)/(hi-lo)*(H-t-b);
  let g='';for(let v=lo;v<=hi;v+=5)g+=`<line x1="${l}" x2="${W-r}" y1="${Yv(v)}" y2="${Yv(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l-6}" y="${Yv(v)+4}" text-anchor="end">${v}</text>`;
  const step=Math.ceil(h.length/10);h.forEach((p,i)=>{if(i%step===0||i===h.length-1)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${p.age}</text>`});
  const pts=h.map((p,i)=>`${X(i).toFixed(1)},${Yv(p.ovr).toFixed(1)}`),last=h[h.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Рейтинг по возрасту">${g}
    <polygon points="${X(0)},${Yv(lo)} ${pts.join(' ')} ${X(h.length-1)},${Yv(lo)}" fill="rgba(255,180,63,.12)"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(h.length-1)}" cy="${Yv(last.ovr)}" r="5" fill="var(--amber)" stroke="var(--bg)" stroke-width="2"/>
    <text x="${X(h.length-1)+9}" y="${Yv(last.ovr)+4}" style="fill:var(--amber);font-weight:700">${last.ovr}</text></svg>`;
}
function totals(){
  const P=G.P,gk=P.pos==='GK',bdo=P.awards.filter(a=>a.n===(gk?'Трофей Яшина':'Золотой мяч')).length,avg=P.tot.apps?(P.tot.rs/P.tot.apps).toFixed(2):'—';
  return `<div class="totals"><div><b>${P.tot.apps}</b><span>матчей</span></div>${gk?`<div><b>${P.tot.cs}</b><span>сухих матчей</span></div><div><b>${P.tot.gc||0}</b><span>пропущено</span></div>`:`<div><b>${P.tot.g}</b><span>голов</span></div><div><b>${P.tot.a}</b><span>передач</span></div>`}<div><b>${avg}</b><span>ср. оценка</span></div><div class="gold"><b>${P.trophies.length}</b><span>трофеев</span></div><div class="gold"><b>${bdo}</b><span>${gk?'трофеев Яшина':'золотых мячей'}</span></div><div><b>${P.caps}/${P.ig}</b><span>сборная: матчи/голы</span></div></div>`;
}
function decisionView(){
  const d=G.pending[0],total=G.pendTotal,idx=total-G.pending.length+1;
  return `<section class="decide ${d.egg?'egg':''}" aria-live="polite"><div class="d-top"><span class="eyebrow">${d.egg?'★ Редкое событие':d.ev?'Событие':'Межсезонье'} ${G.year}</span><span class="pips">${Array.from({length:total},(_,k)=>`<i class="${k+1<idx?'done':k+1===idx?'on':''}"></i>`).join('')}</span><span class="small muted">Решение ${idx} из ${total}</span></div>
    <h2>${esc(d.title)}</h2><p>${esc(d.body)}</p>
    <div class="opts">${d.opts.map((o,i)=>`<button class="opt" data-a="opt" data-i="${i}"><span class="o-l">${esc(o.label)}</span>${o.sub?`<span class="o-s">${esc(o.sub)}</span>`:''}${o.badges?`<span class="badges">${o.badges}</span>`:''}${o.detail?`<span class="o-d">${esc(o.detail)}</span>`:''}</button>`).join('')}</div></section>`;
}

function feed(){
  if(!G.seasons.length)return `<section><div class="sec-h"><h2>Сезоны</h2></div><p class="muted">Здесь появится история карьеры — сезон за сезоном.</p></section>`;

  else if(id==='f-nat2'){f.nat2=e.target.value}
  else if(id==='f-cage'){f.cage=+e.target.value}
  else if(id==='cScheme'&&isCoach()){G.C.tactic.scheme=e.target.value;save();render()}
  else if(id==='cStyle'&&isCoach()){G.C.tactic.style=e.target.value;save();render()}
  else if(id==='tblLg'){UI.tblLg=e.target.value;render()}
  else if(id==='focus'&&G&&G.P){G.P.focus=e.target.value;save()}
  else if(id==='m-nat'){f.nat=e.target.value;if(f.nat2===f.nat)f.nat2='';mpPushSetupSoon();render()}
  else if(id==='m-nat2'){f.nat2=e.target.value;mpPushSetupSoon()}
  else if(id==='m-pos'){f.pos=e.target.value;f.num=NUM_BY_POS[f.pos];mpPushSetupSoon();render()}
  else if(id==='m-lg'){f.lg=e.target.value;f.club=S_LEAGUES.find(l=>l.id===f.lg).clubs[0].name;mpPushSetupSoon();render()}
  else if(id==='m-club'){f.club=e.target.value;mpPushSetupSoon()}
  else if(id==='m-rus'){if(MP.sess&&MP.room&&MP.room.host===MP.sess.pid)mpHostRus(e.target.value);else f.rus=e.target.value}
});
document.addEventListener('submit',e=>{if(e.target.id==='setupForm'){e.preventDefault();startCareer()}else if(e.target.id==='coachForm'){e.preventDefault();startCoach(false)}});
function updPrev(){const f=UI.form,el=document.getElementById('cardPrev');if(el)el.innerHTML=playerCard({ovr:'??',pos:POS[f.pos].s,age:17,num:f.num,name:f.name||'Игрок',club:f.club,nat:f.nat,posFull:POS[f.pos].n})}

/* ================= boot ================= */
function start(data){
  if(data&&data.Gs)G=migrate(JSON.parse(data.Gs));else if(data&&data.G)G=migrate(data.G);else{const s=load();if(s&&s.P&&s.clubs)G=migrate(s)}
  if(G)SAVED=JSON.stringify(G);
  if(G&&G.room&&G.room.token&&!MP.sess){MP.sess={code:G.room.code,pid:G.room.pid,token:G.room.token};mpSave()}
  if(data&&data.UI)Object.assign(UI,data.UI);
  render();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({Gs:SAVED,UI:{tab:UI.tab,tblLg:UI.tblLg,form:UI.form}}))}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
</script>
